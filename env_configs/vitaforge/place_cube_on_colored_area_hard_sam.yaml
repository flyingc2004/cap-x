env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: /mnt/sdc/ljz/ViTaForge
      task_name: place_cube_on_colored_area
      task_config: gelsight.yml
      seed_base: 0
      device: cuda:0
      task_config_overrides:
        observations:
          camera: [rgb, depth]
          tactile: [rgb, rgb_marker, marker, depth, pose]
          embodiment: [joint, ee]
          actor: false
        reset_time_limit: 900
        step_lim: 300
        record_action_frames: true
        record_pre_move_frames: true
      api_configs:
        franka_control_api:
          min_safe_z: 0.08
          default_z_approach: 0.06
          release_hover_height: 0.08
          preserve_landmark_orientation: true
          use_task_grasp_actor_for_objects: false
          use_task_place_actor_for_landmarks: false
          public_anchor_pose_enabled: false
          public_grasp_anchor_objects: []
          rgbd_perception_enabled: true
          rgbd_pose_enabled: true
          rgbd_grasp_enabled: true
          rgbd_pose_objects: [cube, target_area]
          rgbd_grasp_objects: [cube]
          perception_camera: head
          perception_prompt_map:
            cube: [red cube, wooden cube]
            target_area: [yellow square area, colored square frame]
          perception_prompt_fallbacks:
            cube: [cube]
            target_area: [square target area]
          perception_retry_attempts: 1
          sam3_service_url: http://127.0.0.1:8114
          graspnet_service_url: http://127.0.0.1:8115
          adaptive_gripper:
            contact_force_threshold: 0.08
            contact_balance_threshold: 0.45
            depth_contact_margin_mm: 0.5
            target_depth_delta_mm: 4.0
            min_stable_contact_area: 0.006
            post_squeeze_qpos: 0.0001
            post_squeeze_steps: 3
            hold_steps: 6
          object_pose_names:
            cube: cube
            red cube: cube
            target area: target_area
            target_area: target_area
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis: [FrankaControlApi, UniVTACTactileApi]
    prompt: |
      You control a Franka robot in VitaForge. Place the red cube on the instructed colored target area.

      This is a Hard-SAM configuration. Use get_object_pose("cube", source="rgbd"), sample_grasp_pose("cube"), and get_object_pose("target_area", source="rgbd"). Never use public anchors, actor state, metadata, reward, success, or private task fields.

      Use a short bounded chain: approach from the sampled grasp pose, adaptive close, require stable bilateral tactile contact, lift to clearance, transport horizontally above the visual target, descend, open, verify release, then retreat. Vision may verify following or release; tactile contact and slip decide whether transport is safe. Stop after one bounded local retry instead of making an unbounded search.

      Use only FrankaControlApi and UniVTACTactileApi. Print CAPX_FAILURE before a failed return and CAPX_SUCCESS only after release verification.
    multi_turn_prompt: |
      This is failure-only recovery. Use the latest tactile or RGB-D failure reason to regenerate only the unfinished bounded stage. Do not replace a failed visual estimate with an actor anchor or private state.
api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/vitaforge_place_cube_on_colored_area_hard_sam
trial_timeout_seconds: 600
max_trial_retries: 1
max_regenerations: 4
filter_multiturn_console: true
multiturn_console_max_lines: 25
multiturn_console_max_chars: 3500
tactile_memory:
  trial:
    enabled: false
    include_in_multiturn: false
    max_context_chars: 0
  persistent:
    enabled: false
