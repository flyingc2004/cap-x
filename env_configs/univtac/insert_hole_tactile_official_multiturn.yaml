# Multi-turn variant of insert_hole_tactile_official.yaml.
#
# Enables CaP-X's core regenerate loop: after each code block executes, the
# framework feeds {executed_code} + {console_stdout} + {console_stderr} back to
# the LLM and asks it to REGENERATE (append the next block) or FINISH.
# Differences from the base config:
#   - cfg.multi_turn_prompt added (this is the switch that enables the loop)
#   - prompt instructs the model to write short staged blocks instead of one
#     giant closed-loop program
#   - save_multiturn_prompts: true dumps each decision prompt to
#     <output_dir>/.../prompts_and_responses/multi_turn_prompt_XX.txt
#   - trial_timeout_seconds bumped 600 -> 900 (each turn adds one LLM call)
env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: /mnt/sdc/ljz/UniVTAC
      task_name: insert_hole
      task_config: smoke_capx_insert_hole_official
      seed_base: 0
      device: cuda:0
      api_configs:
        franka_control_api:
          min_safe_z: 0.05
          max_delta_xyz: 0.01
          max_delta_rpy: 0.25
          default_z_approach: 0.0
          home_pose_relative_lift: false
          preserve_landmark_orientation: false
          use_task_place_actor_for_landmarks: false
          use_task_grasp_actor_for_objects: false
          use_native_pose_planner: false
          rgbd_perception_enabled: false
          tactile_adaptive_gripper_enabled: true
          min_adaptive_close_force: 0.8
          max_insert_actions: 80
          move_relative_max_lateral: 0.0005
          move_relative_max_rotation: 0.15
          move_relative_lateral_budget: 0.006
          move_relative_rotation_budget: 1.20
          move_relative_lock_on_guard_failure: true
          insert_depth_log_interval: 50
          tactile_guard:
            slip_warning_threshold: 0.35
            slip_high_threshold: 0.55
            slip_hard_threshold: 0.60
            centroid_warning_delta: 0.5
            centroid_high_delta: 1.0
            shear_warning_delta: 0.05
            pitch_couple_sign: 1
            pitch_couple_threshold: 0.15
            pitch_confidence_threshold: 0.25
            guard_micro_down_step: 0.001
            guard_micro_lateral_step: 0.0002
            guard_micro_rpy_step: 0.003
            max_guarded_pitch_request: 0.15
            max_guarded_down_request: 0.008
          max_gripper_servo_steps: 120
          max_gripper_settle_steps: 20
          gripper_settle_steps: 10
          adaptive_gripper:
            coarse_qpos_step: 0.0005
            fine_qpos_step: 0.00005
            contact_debounce_frames: 2
            stable_debounce_frames: 3
            release_debounce_frames: 2
            settle_steps_per_command: 1
            contact_force_threshold: 0.08
            depth_contact_margin_mm: 0.5
            slip_threshold: 0.6
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis:
      - FrankaControlApi
      - UniVTACTactileApi
    prompt: |
      You are controlling a Franka robot in the official UniVTAC insert_hole evaluation protocol.
      Goal: insert the already grasped test tube into the hole while maintaining a stable grasp.
      The official reset and pre-move have already grasped the tube and brought it near the hole entrance. Start from the current state; do not re-grasp from the table, do not open the gripper, and do not use RGB-D relocation in this version.
      Use UniVTAC native tactile feedback as the main feedback signal. First make one adaptive preload close_gripper call with target_force around 0.8 and max_steps around 120. If the preload reports contact loss or unstable contact, finish normally. Otherwise keep the gripper closed throughout insertion.
      Use move_relative for all physical motion. Its coordinate frame is robot base/world. For insert_hole, move_relative internally splits guarded pitch, lateral, and downward requests into safe micro-steps. You may request a larger pitch correction, about 0.05 to 0.15 rad around the world y axis, but do not chase a fixed target angle. You may request guarded downward insertion up to about 0.008 m; the adapter will stop early if tactile risk rises.
      Read get_tactile_summary(window=20) before choosing each correction. The key fields are pitch_cue, pitch_couple, pitch_confidence, quadrant_pressure, quadrant_shear, slip_risk, incipient_slip, pressure_side, shear_side, force_change, drift_trend, and correction_hint. pitch_cue is the force-couple suggestion: "pitch_positive", "pitch_negative", or "ambiguous". Use the suggested pitch direction when confidence is clear; if the cue reverses after a correction, the correction probably overshot and should be reversed more gently.
      Judge each motion from the move_relative result rather than from a fixed local counter. Useful result fields include reason, executed_depth, executed_xyz, executed_rpy, executed_rotation, guard_stop_phase, direction_improved, remaining_actions, success_latched, episode_stopped, and tactile. Treat preempted_by_slip_risk, interrupted_by_slip_warning, direction_not_improving, completed_with_slip, completed_unstable, and clipped commands as recoverable physical feedback, not program failure.
      A good closed-loop pattern is: preload grip, read tactile, apply the pitch_cue with a guarded pitch request, test with a small guarded downward request around 0.001 m, then reassess. If the correction weakens pitch_cue, lowers slip_risk, clears slip, or returns direction_improved=True, print a stage line containing exactly "finds succeed" plus the direction name and current tactile risk, then continue with cautious segmented insertion in that direction. If the result stops in guard_stop_phase="rotation", try the opposite pitch direction or a smaller correction. If the result stops in guard_stop_phase="translation", do not keep pushing downward; reassess pitch_cue or try a tiny lateral probe..If result["clip_reason"] is "move_relative_lateral_budget", the lateral correction did not execute. Do not mark that lateral direction as "finds succeed"; clear any locked lateral direction and switch to pitch correction or guarded downward-only reassessment.
      When pitch_cue is ambiguous and tactile is stable, continue guarded downward insertion in short segments. When pitch_cue is clear, prefer pitch correction over lateral motion. Use lateral probes only as a secondary recovery when pitch corrections do not improve tactile risk. Do not assume tactile left/right labels directly map to world x; choose directions by measured improvement. A probe is valid only when executed_distance > 0 and clipped is false, except for guarded downward insertion where executed_depth > 0 can still count as progress.
      Continue while contact remains present, episode_stopped is false, success_latched is false, and remaining_actions is positive. Rely on success_latched or episode_stopped as the official completion signal. Print a compact final stop reason such as success_latched, episode_stopped, contact_lost, hard_failure, stuck_high_slip, no_progress, or safety_loop_done before the code ends.
      Do not raise, assert, SystemExit, exit, quit, sleep in a no-action loop, or open the gripper for expected physical failure. Keep the gripper closed at the end. Do not call open_gripper() or home_pose().
      Write executable top-level Python code. If you define helper functions, call them before the code block ends; do not only define a function.
      Use only the exposed high-level FrankaControlApi functions and UniVTAC native tactile functions. Do not call low-level movement functions.
      Never inspect private simulator internals, hidden labels, evaluator state, or episode identifiers. Do not load or call ACT or ViTAL policies.
      Multi-turn protocol: you are running in a multi-turn loop. Write only ONE focused code block in this first response (e.g., preload grip, first tactile read, and one guarded probe). After each code block executes, you will be shown its stdout and stderr and asked to respond with REGENERATE (followed by the next code block) or FINISH. The robot state, grasp, and any variables or functions you defined persist across blocks, so each block should continue from the current state without redoing or redefining earlier work. Prefer several short observation-driven blocks over one giant block.
    multi_turn_prompt: |
      The following Python code was just executed in the UniVTAC insert_hole environment:
      ```python
      {executed_code}
      ```
      Current console stdout:
      ```
      {console_stdout}
      ```
      Current console stderr:
      ```
      {console_stderr}
      ```

      Analyze the output for the tactile closed-loop insertion policy:
      - A Python traceback in stderr is a program error. If you see one, write corrected code in your next block; do not repeat the failing call unchanged and never use raise or assert.
      - Printed lines about pitch_cue, pitch_couple, slip_risk, incipient_slip, direction_improved, guard_stop_phase, remaining_actions, success_latched, episode_stopped, clip_reason, and "finds succeed" are physical feedback, not program failures. Treat preempted_by_slip_risk, interrupted_by_slip_warning, direction_not_improving, completed_with_slip, completed_unstable, and clipped commands as recoverable physical outcomes.
      - If stdout or stderr shows success_latched=True or episode_stopped=True, the insertion is complete: respond FINISH.
      - If the preload reported contact loss or unstable contact, or contact was lost during insertion, respond FINISH rather than acting without a stable grasp.
      - Otherwise respond REGENERATE followed by exactly one new Python code block that continues from the current robot state. Variables and functions defined in the executed code remain available; do not redefine or redo completed actions.
      - Choose the next block from the servo loop: read get_tactile_summary(window=20), then either apply the pitch_cue with a guarded move_relative pitch correction (about 0.02 to 0.08 rad, no fixed target angle), probe downward about 0.001 m with a guarded move_relative, or continue cautious segmented downward insertion when pitch_cue is ambiguous and tactile is stable. If guard_stop_phase was "rotation", try the opposite pitch direction or a smaller correction; if it was "translation", reassess pitch_cue or try a tiny lateral probe instead of pushing down. Keep the gripper closed at all times. End the block at a natural decision point and print a compact progress line.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/univtac_insert_hole_tactile_official_multiturn
save_multiturn_prompts: true
trial_timeout_seconds: 900
max_trial_retries: 1
