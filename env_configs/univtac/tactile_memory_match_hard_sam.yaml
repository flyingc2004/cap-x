# ARCHIVED EXPERIMENT. Earlier Hard-SAM full-transport configuration; it is
# not upgraded to the current public-v4 response-expression selection path.
# The name does not distinguish memory enablement: it uses trial memory only,
# with persistent memory disabled. Do not use for new experiments. See README.
env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    stream_user_code_output: false
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: /mnt/sdc/ljz/UniVTAC
      task_name: tactile_memory_match
      task_config: tactile_memory_match_smoke
      seed_base: 0
      device: cuda:0
      live_preview_enabled: true
      live_preview_path: ${oc.env:CAPX_LIVE_PREVIEW_PATH,/tmp/capx_latest_preview.jpg}
      live_preview_stride: 5
      live_preview_jpeg_quality: 80
      task_config_overrides:
        official_task_protocol: true
        record_video_during_reset: true
        record_action_frames: true
        video_frame_stride: 4
      api_configs:
        franka_control_api:
          llm_api_profile: tactile_memory_match
          llm_visible_functions: [get_object_pose, sample_grasp_pose, goto_pose, move_delta, rotate_gripper, open_gripper, close_gripper, wait_steps]
          local_delta_max_m: 0.02
          local_delta_segment_m: 0.002
          local_yaw_max_rad: 0.18
          local_yaw_segment_rad: 0.09
          local_wait_max_steps: 20
          profile_open_width: 1.0
          profile_open_max_steps: 120
          transport_close_target_force: 0.82
          transport_close_max_steps: 120
          min_safe_z: 0.035
          native_min_ee_z: 0.035
          max_delta_xyz: 0.012
          max_delta_rpy: 0.25
          max_delta_gripper: 0.02
          default_z_approach: 0.04
          release_hover_height: 0.13
          home_pose_relative_lift: true
          home_lift_delta_z: 0.05
          preserve_landmark_orientation: true
          gripper_settle_steps: 10
          use_task_place_actor_for_landmarks: false
          use_task_grasp_actor_for_objects: true
          grasp_xy_tolerance: 0.08
          grasp_z_tolerance: 0.04
          grasp_pre_dis: 0.04
          grasp_dis: 0.0
          grasp_height: 0.04
          use_native_pose_planner: true
          record_perception_diagnostic: false
          official_anchor_fallback_enabled: false
          official_anchor_fallback_objects: []
          max_goto_pose_actions: 90
          max_home_pose_actions: 20
          max_native_pose_actions: 2
          max_gripper_servo_steps: 160
          min_open_gripper_servo_steps: 80
          max_gripper_settle_steps: 20
          goto_pose_tactile_guard_force_threshold: 0.45
          goto_pose_tactile_guard_slip_threshold: 0.45
          lift_after_close: false
          open_gripper_width: 1.0
          tactile_adaptive_gripper_enabled: true
          rgbd_perception_enabled: true
          rgbd_pose_enabled: true
          rgbd_grasp_enabled: false
          rgbd_pose_objects:
            - reference_object
            - candidate_left
            - candidate_right
            - match_slot
          rgbd_grasp_objects: []
          public_anchor_pose_enabled: false
          public_grasp_anchor_objects: []
          public_pose_fallback_objects: []
          cache_rgbd_pose_objects:
            - match_slot
          perception_camera: head
          perception_prompt_map:
            reference_object: [yellow cylinder, cylindrical can, cylinder]
            match_slot: [green pad, placement pad, square green target]
          perception_prompt_fallbacks:
            reference_object: [can, round object]
            match_slot: [target pad, pad]
          perception_selector_map:
            reference_object: world_y_max
          perception_retry_attempts: 2
          sam3_service_url: http://127.0.0.1:8114
          graspnet_service_url: http://127.0.0.1:8115
          perception_timeout_seconds: 120
          perception_min_depth_points: 32
          grasp_local_z_offset: 0.12
          adaptive_gripper:
            coarse_qpos_step: 0.0005
            fine_qpos_step: 0.00005
            contact_debounce_frames: 2
            stable_debounce_frames: 3
            release_debounce_frames: 2
            settle_steps_per_command: 1
            contact_force_threshold: 0.08
            contact_balance_threshold: 0.50
            depth_contact_margin_mm: 0.5
            slip_threshold: 0.60
            target_depth_delta_mm: 5.0
            min_stable_contact_area: 0.006
            post_squeeze_qpos: 0.00015
            post_squeeze_steps: 4
            hold_steps: 8
          object_pose_names:
            reference: reference_object
            reference_object: reference_object
            object_a: reference_object
            candidate_left: candidate_left
            left_candidate: candidate_left
            candidate_right: candidate_right
            right_candidate: candidate_right
            match_slot: match_slot
            target_slot: match_slot
            slot: match_slot
        univtac_tactile_api:
          llm_visible_functions: [get_tactile_measurement_protocol, capture_tactile_observation, is_contacting, is_slipping, is_grasp_stable, write_trial_memory, read_trial_memory]
        tactile_measurement_protocol:
          capture_window: 20
          settle_steps: 10
          close_target_force: 0.82
          close_max_steps: 120
          probe_lift_m: 0.018
          probe_hold_steps: 10
          max_attempts_per_object: 2
          adaptive_close: true
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis:
      - FrankaControlApi
      - UniVTACTactileApi
    prompt: |
      You control UniVTAC tactile_memory_match Hard-SAM. get_object_pose(name) automatically uses the configured SAM/RGB-D route; never request a source override. Use vision only for coarse localization and grasp/drop/release checks. The hidden matching identity must be decided only from tactile measurements; never read actor state, visual appearance, metadata, labels, density, friction, hardness, reward, success, private task state, or low-level environment objects.

      Call get_tactile_measurement_protocol() once and save the unchanged record as trial_memory.v1 state key probe_spec. Define one reusable probe(object_name) helper and execute it in fixed order: reference_object, candidate_left, candidate_right. For each object, localize through get_object_pose(object_name), use sample_grasp_pose(object_name) when its configured route provides a side-grasp target, then goto_pose the returned semantic pose. Do not descend directly from raw RGB-D coordinates. Use the identical chain for all three objects: open_gripper(); close_gripper(mode="probe"); wait for protocol settling; require is_grasp_stable(); call capture_tactile_observation() for static evidence; move_delta(dz=probe_lift_m); wait for protocol hold; require stable non-slipping contact; call capture_tactile_observation() for dynamic evidence; move_delta(dz=-probe_lift_m); open_gripper(); verify release with is_contacting(). Do not use get_robot_state, global coordinates, direct environment access, or low-level motion APIs.

      Persist one trial_memory.v1 evidence record per valid object. Static evidence is bilateral depth_mm, marker_displacement_px, and marker_coherence. Dynamic evidence is the same bilateral fields at lift minus static, with capture IDs, unchanged probe_spec, validity, and provenance. Invalid close, lost bilateral contact, slip, or drop must print CAPX_FAILURE reason=insufficient_tactile_evidence and stop without guessing.

      Read the known reference_object, candidate_left, and candidate_right evidence. Compute normalized static and dynamic RMS distances, fuse them equally, select only the lower score, and write selection with both scores, margin, features, rule, confidence, rationale, and provenance.

      Final transport is independent: sample_grasp_pose(selected); goto_pose; close_gripper(mode="transport"); require stable contact; get_object_pose("match_slot"); goto_pose(slot_position, slot_quaternion); open_gripper(); verify release; print CAPX_SUCCESS. For public slot placement the adapter executes expert-aligned clearance lift, horizontal transport, and vertical descent. If transport contact weakens, slips, rotates, or drops, print CAPX_FAILURE and stop. Return concise executable Python only.
    multi_turn_prompt: |
      Executed code:
      {executed_code}

      Console stdout:
      {console_stdout}

      Console stderr:
      {console_stderr}

      This is failure-only recovery. Preserve simulator state and the injected public trial-memory snapshot. Read only known keys probe_spec, evidence_reference_object, evidence_candidate_left, evidence_candidate_right, and selection as needed. Never replay valid probes, replace the shared protocol, use private data, or call hidden APIs. If final transport lost contact, regenerate only a concise transport-mode regrasp-or-stop continuation using sample_grasp_pose, goto_pose, close_gripper(mode="transport"), get_object_pose("match_slot"), and goto_pose. After verified final release, print CAPX_SUCCESS and finish without extra motion.
api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/univtac_tactile_memory_match_hard_sam
trial_timeout_seconds: 900
max_trial_retries: 1
max_regenerations: 8
save_multiturn_prompts: true
split_code_blocks_on_breakpoint: true
multi_turn_on_failure_only: true
regenerate_full_chain_on_static_failure: true
filter_multiturn_console: true
multiturn_console_max_lines: 35
multiturn_console_max_chars: 5000
multiturn_console_keep_recent_other: 5
multiturn_executed_code_max_chars: 6000
multiturn_remaining_code_max_chars: 3000
tactile_memory:
  trial:
    enabled: true
    include_in_multiturn: true
    max_context_chars: 4000
  persistent:
    enabled: false
