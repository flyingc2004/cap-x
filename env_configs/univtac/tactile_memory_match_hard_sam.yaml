env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    stream_user_code_output: false
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: /mnt/sdc/ljz/UniVTAC
      task_name: tactile_memory_match
      task_config: tactile_memory_match_smoke
      seed_base: 0
      device: cuda:0
      live_preview_enabled: true
      live_preview_path: /mnt/sdc/ljz/t-cap/capx-runs/latest_preview.jpg
      live_preview_stride: 5
      live_preview_jpeg_quality: 80
      task_config_overrides:
        official_task_protocol: true
        record_video_during_reset: true
        record_action_frames: true
        video_frame_stride: 4
      api_configs:
        franka_control_api:
          min_safe_z: 0.035
          native_min_ee_z: 0.035
          max_delta_xyz: 0.012
          max_delta_rpy: 0.25
          max_delta_gripper: 0.02
          default_z_approach: 0.04
          release_hover_height: 0.13
          home_pose_relative_lift: true
          home_lift_delta_z: 0.05
          preserve_landmark_orientation: true
          gripper_settle_steps: 10
          use_task_place_actor_for_landmarks: false
          use_task_grasp_actor_for_objects: true
          grasp_xy_tolerance: 0.08
          grasp_z_tolerance: 0.04
          grasp_pre_dis: 0.04
          grasp_dis: 0.0
          grasp_height: 0.04
          use_native_pose_planner: true
          record_perception_diagnostic: false
          official_anchor_fallback_enabled: false
          official_anchor_fallback_objects: []
          max_goto_pose_actions: 90
          max_home_pose_actions: 20
          max_native_pose_actions: 2
          max_gripper_servo_steps: 160
          min_open_gripper_servo_steps: 80
          max_gripper_settle_steps: 20
          goto_pose_tactile_guard_force_threshold: 0.45
          goto_pose_tactile_guard_slip_threshold: 0.45
          lift_after_close: false
          open_gripper_width: 1.0
          tactile_adaptive_gripper_enabled: true
          rgbd_perception_enabled: true
          rgbd_pose_enabled: true
          rgbd_grasp_enabled: false
          rgbd_pose_objects:
            - reference_object
            - candidate_left
            - candidate_right
            - match_slot
          rgbd_grasp_objects: []
          public_anchor_pose_enabled: false
          public_grasp_anchor_objects: []
          public_pose_fallback_objects: []
          cache_rgbd_pose_objects:
            - match_slot
          perception_camera: head
          perception_prompt_map:
            reference_object: [yellow cylinder, cylindrical can, cylinder]
            match_slot: [green pad, placement pad, square green target]
          perception_prompt_fallbacks:
            reference_object: [can, round object]
            match_slot: [target pad, pad]
          perception_selector_map:
            reference_object: world_y_max
          perception_retry_attempts: 2
          sam3_service_url: http://127.0.0.1:8114
          graspnet_service_url: http://127.0.0.1:8115
          perception_timeout_seconds: 120
          perception_min_depth_points: 32
          grasp_local_z_offset: 0.12
          adaptive_gripper:
            coarse_qpos_step: 0.0005
            fine_qpos_step: 0.00005
            contact_debounce_frames: 2
            stable_debounce_frames: 3
            release_debounce_frames: 2
            settle_steps_per_command: 1
            contact_force_threshold: 0.08
            contact_balance_threshold: 0.50
            depth_contact_margin_mm: 0.5
            slip_threshold: 0.60
            target_depth_delta_mm: 5.0
            min_stable_contact_area: 0.006
            post_squeeze_qpos: 0.00015
            post_squeeze_steps: 4
            hold_steps: 8
        tactile_measurement_protocol:
          capture_window: 20
          settle_steps: 10
          probe_lift_m: 0.018
          probe_hold_steps: 10
          max_attempts_per_object: 2
          adaptive_close: true
          object_pose_names:
            reference: reference_object
            reference_object: reference_object
            object_a: reference_object
            candidate_left: candidate_left
            left_candidate: candidate_left
            candidate_right: candidate_right
            right_candidate: candidate_right
            match_slot: match_slot
            target_slot: match_slot
            slot: match_slot
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis:
      - FrankaControlApi
      - UniVTACTactileApi
    prompt: |
      You control a Franka robot in UniVTAC tactile_memory_match Hard-SAM. Measure reference_object, candidate_left, and candidate_right under one shared tactile protocol, use only tactile evidence to select the physical match, then place only that selected candidate on match_slot.

      The reset pre-move leaves the empty gripper near reference_object. Use get_object_pose(name, source="rgbd") only for coarse localization. Before every probe or final regrasp, call sample_grasp_pose(name) and use its gripper-compatible pose for goto_pose; never descend directly to a raw RGB-D pose. Do not use source="anchor", actor state, visual appearance, metadata, density, friction, reward, success, or a task field to decide identity. Vision may only validate grasp following, rotation, drop, and final release.

      UniVTACTactileApi is neutral: it never creates profiles, scores candidates, or returns a hidden label. Call get_tactile_measurement_protocol() once at the beginning. Persist its entire returned dictionary unchanged as a trial_memory.v1 state record named probe_spec; use its capture window, settling, adaptive-close mode, probe lift, hold, and maximum attempts unchanged for all three objects. Do not hard-code a replacement protocol.

      capture_tactile_observation(protocol["capture_window"]) returns tactile_observation.v1. Its matching fields are capture["tactile"]["left_depth_mm"], capture["tactile"]["right_depth_mm"], capture["marker_motion"]["left_marker_displacement_px"], capture["marker_motion"]["right_marker_displacement_px"], capture["marker_motion"]["left_marker_coherence"], and capture["marker_motion"]["right_marker_coherence"]. It also exposes bilateral contact, stable, slip, and gripper state. Persist only JSON-safe scalar evidence, never images or raw arrays.

      Write trial_memory.v1 envelopes with write_trial_memory(key, record). The kind must be evidence, hypothesis, decision, or state and every evidence/decision record must retain capture_ids and memory_keys provenance. You choose the signature, feature weights, comparison rule, scores, margin, and confidence in code.

      Generate concise executable Python only. Define one reusable probe(object_name) helper and call it in the fixed order reference_object, candidate_left, candidate_right. For each protocol-permitted attempt: sample the grasp pose, adaptive-close using probe_spec, settle, capture static evidence after bilateral stable contact, perform the shared short lift/hold, capture dynamic evidence, return to the pre-lift pose, open, verify release, and move upward before travelling to the next object. Dynamic evidence must include each hand's displacement change from static plus contact/slip/drop validity. A shallow/empty close, lost bilateral contact, or drop invalidates the entire attempt: discard its evidence, release and clear safely, then follow the unchanged probe_spec maximum-attempt policy. Once that policy is exhausted, print CAPX_FAILURE reason=insufficient_tactile_evidence and stop without guessing.

      After all three valid probes, read their evidence records and choose the tactile match yourself. A compact optional signature is bilateral static depth, bilateral static marker displacement, bilateral dynamic marker-displacement change, and bilateral static coherence, but you choose the weights and rule. Before final transport write one decision record containing selected_candidate, chosen_features, weights_or_rule, score_left, score_right, score_margin, rationale, confidence, and provenance.

      Final transport is separate from the probe: regrasp only the selected candidate, require a new stable bilateral tactile grasp, lift to safe clearance, move horizontally above match_slot, descend, release, verify release, and retreat. If this final grasp or transport becomes invalid, print CAPX_FAILURE; do not use probe evidence as proof that the transport grasp is stable. Print CAPX_SUCCESS only after final release verification. Use direct public APIs only; do not use low-level motion APIs, private state, UniVTAC policies, or hard-coded world coordinates.
    multi_turn_prompt: |
      Executed code:
      {executed_code}

      Console stdout:
      {console_stdout}

      Console stderr:
      {console_stderr}

      This is failure-only multi-turn recovery. Preserve the simulator state and public trial-memory snapshot. Do not replay completed stages unless stderr reports StaticCodeError or SyntaxError: in that case the initial code was rejected before a valid action chain, so regenerate one concise full main chain. Otherwise, read list_trial_memory(), whose records are trial_memory.v1, before deciding what is missing and regenerate only the minimal continuation that restores the failed stage.

      Read probe_spec and existing records before acting. Preserve its exact adaptive-close mode, capture window, lift, hold, and max-attempt policy for every unfinished object. Keep valid evidence, hypotheses, decisions, capture_ids, and memory_keys intact. An invalid probe may use only its remaining protocol-permitted symmetric measurement; once exhausted, write insufficient_tactile_evidence and stop. Do not replace the agent's comparison logic with a fixed formula or a hidden label.

      A release must be confirmed before moving toward the next object. If transport contact weakens, slips, rotates, or drops, regenerate a short regrasp-or-stop continuation. After a verified final release, print CAPX_SUCCESS and finish without extra motion.
api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/univtac_tactile_memory_match_hard_sam
trial_timeout_seconds: 900
max_trial_retries: 1
max_regenerations: 8
save_multiturn_prompts: true
split_code_blocks_on_breakpoint: true
multi_turn_on_failure_only: true
regenerate_full_chain_on_static_failure: true
filter_multiturn_console: true
multiturn_console_max_lines: 35
multiturn_console_max_chars: 5000
multiturn_console_keep_recent_other: 5
multiturn_executed_code_max_chars: 6000
multiturn_remaining_code_max_chars: 3000
tactile_memory:
  trial:
    enabled: true
    include_in_multiturn: true
    max_context_chars: 4000
  persistent:
    enabled: false
