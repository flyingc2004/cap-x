# Probe-only companion to the ViTaForge OpenTac tension-strap control entry.
env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    stream_user_code_output: false
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: ${oc.env:UNIVTAC_ROOT,/mnt/sdc/ljz/ViTaForge_capx_tension}
      task_name: tension_strap
      task_config: tension_strap_capx_control
      force_task: true
      force_task_seed: ${oc.env:CAPX_FORCE_TASK_SEED,1}
      seed_base: ${oc.env:CAPX_FORCE_TASK_SEED,1}
      device: cuda:0
      live_preview_enabled: true
      live_preview_path: ${oc.env:CAPX_LIVE_PREVIEW_PATH,/tmp/capx_tension_strap_preview.jpg}
      live_preview_stride: 5
      live_preview_jpeg_quality: 85
      api_configs:
        franka_control_api:
          llm_api_profile: opentac_tension_control
          llm_visible_functions: [move_delta, open_gripper, close_gripper, get_robot_state, wait_steps]
          tactile_adaptive_gripper_enabled: true
          use_native_pose_planner: true
          max_goto_pose_actions: 90
          max_native_pose_actions: 2
          max_gripper_servo_steps: 120
        opentac_api:
          llm_visible_functions: [get_tactile_tension_control_contract, begin_tactile_tension_estimator, get_tactile_tension_estimate, get_tactile_stage_memory, capture_tactile_stage_response]
          tension_calibration_path: task_config/force_task_rgb/tension_strap_dual_stage.json
          tactile_stage_memory_path: ${oc.env:CAPX_TENSION_STRAP_STAGE_MEMORY,env_configs/univtac/tactile_response_memory/tension_strap_12n_18n.v1.json}
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis: [FrankaControlApi, OpenTacApi]
    prompt: |
      You control a public tactile-response probe for a ViTaForge tension-strap task. The task instruction defines two public target stages in sequence. Use only FrankaControlApi and OpenTacApi. Never read or infer hidden force labels, actor state, reward, success, metadata, private task fields, or direct environment objects.

      Call get_tactile_stage_memory() once and keep it unchanged in local program state. Its capture protocol defines the only valid response window. Do not modify its prototypes, IQR scales, window length, or contact-quality gates. The stage names in the read-only memory are target names, not observations of the current stage.

      Use the public task initialization and public robot state only to make a safe coarse approach. When bilateral tactile contact is established, initialize the public marker-RGB estimator, use only its estimate and control contract for local vertical adjustment, then hold the current public control action for exactly the configured response window before calling capture_tactile_stage_response(). If its quality.valid is false, print CAPX_FAILURE reason=insufficient_tactile_evidence; do not guess a stage.

      For valid evidence, extract every configured response-block field, apply its declared transform, and compute each stage distance as the mean of block RMS((response - prototype_median) / shared_calibration_iqr). Use the single shared retrieval_scaler from the frozen memory for both stage distances; do not compare stage-specific prototype IQR distances. Keep both scores, margin, selected memory_id, target stage, response capture_id, used block names, and rationale in local program state. Print one concise CAPX_RETRIEVAL diagnostic. The API does not score or choose for you.

      This configuration is probe-and-retrieval only. Do not claim task success, use a hidden true-tension signal, or refit memory from this trial. Return concise executable Python only.
    multi_turn_prompt: |
      Executed code:
      {executed_code}

      Console stdout:
      {console_stdout}

      Console stderr:
      {console_stderr}

      This is failure-only recovery. Preserve valid tactile evidence and the frozen memory snapshot. Continue only with the incomplete probe or record an explicit insufficient-evidence failure. Do not refit, replace, or swap the stage memories.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/vitaforge_tension_strap_stage_probe
trial_timeout_seconds: 900
max_trial_retries: 1
max_regenerations: 1
save_multiturn_prompts: true
split_code_blocks_on_breakpoint: true
multi_turn_on_failure_only: true
filter_multiturn_console: true
multiturn_console_max_lines: 35
multiturn_console_max_chars: 5000
multiturn_console_keep_recent_other: 5
multiturn_executed_code_max_chars: 6000
multiturn_remaining_code_max_chars: 3000
tactile_memory:
  trial:
    enabled: true
    include_in_multiturn: true
    max_context_chars: 4000
  persistent:
    enabled: false
