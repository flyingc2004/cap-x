# Visual-assist variant of the public OpenTac tension-strap benchmark.
# Stage completion remains numerical: raw RGB is an anomaly guard only.
env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    stream_user_code_output: false
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: ${oc.env:UNIVTAC_ROOT,/mnt/sdc/ljz/ViTaForge}
      task_name: tension_strap
      task_config: tension_strap
      force_task: true
      force_task_seed: ${oc.env:CAPX_FORCE_TASK_SEED,1}
      seed_base: ${oc.env:CAPX_FORCE_TASK_SEED,1}
      device: cuda:0
      live_preview_enabled: true
      live_preview_path: ${oc.env:CAPX_LIVE_PREVIEW_PATH,/tmp/capx_tension_strap_preview.jpg}
      live_preview_stride: 5
      live_preview_jpeg_quality: 85
      # 120 Hz physics / 8 = 15 fps, matching simulated time without encoding
      # the full native dashboard at every tactile render.
      video_stream_fps: 15.0
      video_renderer: task_native
      tension_response_panel:
        enabled: true
        history_points: 360
      task_config_overrides:
        # Keep native physical termination active for visual runs as well.
        official_task_protocol: true
        task_cfg_overrides:
          save_pre_move: false
        record_video_during_reset: false
        record_pre_move_frames: false
        record_pre_move_tactile_timeline: false
        runtime_task_mode: eval_test
        render_frequency: 2
        video_frequency: 0
        video_frame_stride: 8
        force_task_adapter_pre_move: true
      runtime_preflight:
        enabled: true
        tacex_root: ${oc.env:TACEX_RUNTIME_ROOT,/mnt/sdc/ljz/ViTaForge/third_party/TacEx}
        require_contact_gradient: true
        require_attached_gelpad_asset: true
        require_attachment_points: true
      api_configs:
        franka_control_api:
          llm_api_profile: opentac_tension_control
          llm_visible_functions: [move_delta, open_gripper, close_gripper, get_robot_state, wait_steps]
          tactile_adaptive_gripper_enabled: true
          use_native_pose_planner: false
          # Match the expert's capped 2 mm/s pull at 60 Hz.
          local_delta_max_m: 0.00003333333333333333
          local_delta_segment_m: 0.00003333333333333333
          force_task_target_lead_m: 0.00003333333333333333
          min_safe_z: 0.10
          max_gripper_servo_steps: 400
          adaptive_gripper:
            # Same public two-tick, bounded-depth close protocol as the
            # official expert.  The stop condition remains bilateral depth,
            # never a seed-specific qpos.
            coarse_qpos_step: 0.0001
            fine_qpos_step: 0.0001
            settle_steps_per_command: 2
            contact_debounce_frames: 1
            stable_debounce_frames: 1
            contact_force_threshold: 0.0
            contact_balance_threshold: 1.0
            slip_threshold: 1.0
            one_sided_force_limit: 1.1
            target_depth_delta_mm: 6.4
            min_stable_contact_area: 0.0
            post_squeeze_qpos: 0.0
            post_squeeze_steps: 0
            hold_steps: 0
        opentac_api:
          llm_visible_functions: [get_tactile_tension_control_contract, begin_tactile_tension_estimator, get_tactile_tension_estimate, capture_tactile_stage_response]
          tension_estimator_mode: public_depth_marker_regression_v1
          tension_calibration_path: env_configs/univtac/tension_calibration/tension_strap_public_tactile_force_69seed.v1.json
          tactile_stage_memory_path: env_configs/univtac/tactile_response_memory/tension_strap_12n_18n.v2.json
          max_delta_z_m: 0.00003333333333333333
          observation_wait_steps: 2
          observation_dt_s: 0.008333333333333333
          stage_hold_seconds: 3.0
          estimator_settle_steps: 30
          force_filter_time_constant_s: 0.15
          controller_deadband_N: 0.02
          proportional_delta_gain_m_per_N: 0.000008333333333333333
          stage_targets_N: [12.0, 18.0]
          stage_tolerance_N: 0.5
          estimator_update_stride: 1
          max_estimate_age_steps: 3
          # Artifact-only public audit. It never reaches the LLM context and
          # contains marker-derived features, tracking quality, and robot pose
          # but no task force, scorer, reward, or success fields.
          estimator_audit_stride: 5
          # Evaluator-only: pairs public estimates with private physics in a
          # post-run artifact. It never enters an API response, prompt, video,
          # or control decision.
          private_force_audit:
            enabled: true
            sample_stride: 1
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis: [FrankaControlApi, OpenTacApi]
    prompt: |
      Complete this public tension-strap task using only the documented top-level functions from FrankaControlApi and OpenTacApi. Do not import API modules, instantiate API classes, access the environment, task fields, actor state, true simulator tension, reward, success, metadata, or private observations.

      The task is two ordered numerical tension holds with the same continuous grasp: first hold the public estimated tension in the first band returned by get_tactile_tension_control_contract(), then, without opening or regrasping, increase tension and hold the second returned band. Each hold must remain inside its own band for the full continuous duration returned by the contract. Do not use an image to estimate Newtons or decide that a stage is complete. Only available estimated_tension_N plus your own continuous in-band timer can complete a stage.

      The adapter has already placed an open gripper at the public non-contact strap approach. First call close_gripper(adaptive=True, target_force=0.0, max_steps=400). This is the expert's public bilateral-depth close budget, not a fixed qpos, width, depth, or physical-force target. Continue only if both its top-level stable and bilateral_contact booleans are true; otherwise print CAPX_FAILURE and raise RuntimeError. Do not start the estimator from a partial grasp and do not invent a regrasp policy. Then wait contract["estimator_settle_steps"] without motion, and call begin_tactile_tension_estimator() once. Print exactly CAPX_VISUAL_CHECKPOINT grasp_ready after that setup. Then use breakpoint_code_block() on its own line.

      In the next block, retrieve a fresh contract. Use only get_tactile_tension_estimate() and its available / estimated_tension_N fields for local proportional z control. Positive move_delta(dz=...) pulls upward and increases tension; negative dz relaxes it. Read the first target band from contract["stage_bands_N"][0]. The hold duration key is exactly contract["stage_hold_seconds"]; do not use hold_duration_seconds or any other invented key. At contract["sampling_cadence_steps"], sample the estimate. Maintain filtered_tension locally: initialize it from the first available estimated_tension_N, then update it at every later available sample with contract["force_filter_alpha"] as filtered += alpha * (raw - filtered). Use filtered_tension, not a single raw sample, for band membership and control. Add contract["sampling_cadence_seconds"] to your local in-band timer only for a filtered value inside the band, and reset it for every unavailable or filtered out-of-band sample. Outside the band, calculate error = target - filtered_tension; if abs(error) is at or below contract["controller_deadband_N"], do not move, otherwise call move_delta(dz=...) once using the clipped proportional delta from contract["proportional_delta_gain_m_per_N"] and contract["max_delta_z_m"]. A move_delta already advances one native control cadence: immediately read a fresh estimate on the next loop and do not add wait_steps immediately after it. Use wait_steps(contract["sampling_cadence_steps"]) only while holding inside the band or while an estimate is unavailable. Do not create a local sample, retry, action, or iteration cap; the native physical terminal conditions and trial timeout are the only bounds. When the first continuous hold finishes, call capture_tactile_stage_response() only as a diagnostic, print exactly CAPX_VISUAL_CHECKPOINT hold_12n_complete, and put breakpoint_code_block() on its own line. Do not require any 10D response distance or visual condition as a gate.

      In the third block, retrieve a fresh contract and continue the same grasp. Control the second band from contract["stage_bands_N"][1] by the same numerical rule. It requires additional upward motion after the first hold; do not release, reopen, or return to the approach pose. When its continuous numerical hold finishes, call capture_tactile_stage_response() for diagnostics and end normally. The task independently applies the expert's physical terminal contract: two ordered 3-second physical holds, with grasp-loss, overload, travel-limit, and 60-second timeout handling. Do not invent arbitrary per-stage action-count limits, early-success conditions, or terminal heuristics.

      The initial prompt contains raw public head/wrist RGB. After grasp_ready and hold_12n_complete, the runner may attach a previous-versus-current raw camera comparison. Vision is an anomaly guard only: it may identify visible grasp loss, strap slackness, drift, or a sudden abnormal change. If vision looks concerning while the numerical estimate remains available, do not reverse or complete a stage based on the image. Instead use a smaller subsequent numerical adjustment or wait/re-observe. If the grasp is visibly lost and no bilateral grasp remains, print CAPX_FAILURE and raise RuntimeError. At a normal visual checkpoint, answer the runner's follow-up with CONTINUE so the next existing code block executes.

      Every block must be independently executable. Retrieve contract again at the start of any block that needs it. Keep stdout concise. On a deliberate physical failure print CAPX_FAILURE and raise RuntimeError; do not swallow errors. Return all three blocks either in one Python fence with the two breakpoint_code_block() lines, or in three ordered Python fences. The runner preserves all fences in order.
    multi_turn_prompt: |
      Executed code:
      {executed_code}

      Console stdout:
      {console_stdout}

      Console stderr:
      {console_stderr}

      This is a checkpoint-or-failure continuation. At a normal CAPX_VISUAL_CHECKPOINT, preserve the numerical plan and answer CONTINUE so the next existing block runs. Regenerate only after a genuine execution failure or a clearly visible physical anomaly. The simulator is already at the executed state, so regenerated code must be a short self-contained continuation and must retrieve a fresh contract rather than relying on earlier Python variables. Raw RGB can identify grasp/strap anomalies but cannot estimate Newtons, complete a hold, reset a numerical timer, reveal true tension, or override estimated_tension_N. Preserve the environment-owned physical terminal contract; do not add action-count terminal conditions or claim task success yourself. Do not use actor state, true tension, reward, success, task metadata, or frozen-memory distances. Do not reopen or regrasp between normal 12N and 18N progression.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/vitaforge_tension_strap_stage_memory_control_visual
trial_timeout_seconds: 1200
max_trial_retries: 1
max_regenerations: 1
stop_multiturn_when_regeneration_exhausted: true
save_multiturn_prompts: true
split_code_blocks_on_breakpoint: true
multi_turn_on_failure_only: true
multiturn_requires_checkpoint_or_failure: true
filter_multiturn_console: true
multiturn_console_max_lines: 10
multiturn_console_max_chars: 1000
multiturn_console_keep_recent_other: 0
multiturn_executed_code_max_chars: 3000
multiturn_remaining_code_max_chars: 1000
use_visual_feedback: true
use_wrist_camera: true
visual_feedback_allow_unlisted_model: true
visual_feedback_require_image_input: true
visual_feedback_raw_camera_views: true
visual_feedback_max_image_side_px: 512
visual_feedback_jpeg_quality: 80
visual_checkpoint_markers: [grasp_ready, hold_12n_complete]
include_trial_memory_in_multiturn: true
multiturn_trial_memory_max_chars: 1000
tactile_memory:
  trial:
    enabled: false
    include_in_multiturn: false
  persistent:
    enabled: false
