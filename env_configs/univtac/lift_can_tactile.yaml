env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: /mnt/sdc/ljz/UniVTAC
      task_name: lift_can
      task_config: smoke_capx_lift_can
      seed_base: 0
      device: cuda:0
      api_configs:
        franka_control_api:
          min_safe_z: 0.10
          max_delta_xyz: 0.01
          max_delta_rpy: 0.25
          max_delta_gripper: 0.02
          default_z_approach: 0.08
          release_hover_height: 0.15
          preserve_landmark_orientation: true
          gripper_settle_steps: 10
          use_task_grasp_actor_for_objects: true
          grasp_xy_tolerance: 0.08
          grasp_z_tolerance: 0.04
          grasp_pre_dis: 0.04
          grasp_dis: 0.0
          grasp_height: 0.04
          lift_after_close: false
          lift_after_close_z: 0.05
          close_gripper_qpos: 0.007
          open_gripper_width: 1.0
          adaptive_gripper:
            coarse_qpos_step: 0.0005
            fine_qpos_step: 0.00005
            contact_debounce_frames: 2
            stable_debounce_frames: 3
            release_debounce_frames: 2
            settle_steps_per_command: 1
            contact_force_threshold: 0.08
            depth_contact_margin_mm: 0.5
          object_pose_names:
            can: can
            object: can
            target object: can
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis:
      - FrankaControlApi
      - UniVTACTactileApi
    prompt: |
      You are controlling a Franka robot inside UniVTAC.
      Task: grasp the cylindrical can, lift and reorient it, then release it upright on the table as required by the native UniVTAC lift_can benchmark.
      The public can pose is available as exactly two values: can_pos, can_quat = get_object_pose("can"). Only calls with return_bbox_extent=True return three values.
      Use this high-level sequence: open_gripper(adaptive=True), sample_grasp_pose("can"), goto_pose(grasp_pos, grasp_quat, z_approach=0.08), close_gripper(adaptive=True, target_force=1.0, max_steps=160), inspect UniVTAC native tactile feedback, then lift in two 0.05 meter increments.
      The adaptive close/open controller changes only gripper width. It never moves or lifts the arm and never retries a grasp on its own.
      Check the close result: grasp_result = close_gripper(adaptive=True, target_force=1.0, max_steps=160). A force value of 1.0 means both native tactile depth maps reached the calibrated lift_can compression target. Only lift when grasp_result["stable"] is true.
      If grasp_result["stable"] is false, call open_gripper(adaptive=True), make a small safe pose adjustment, and explicitly retry the grasp before lifting.
      If all grasp retries fail, open the gripper, return home, and guard the lift code with a boolean so the program reaches its end normally. Do not call exit, quit, raise SystemExit, raise an exception, or use assert for an expected task failure.
      After closing and after each 0.05 meter lift increment, call get_tactile_summary(window=20, hand="both") to inspect contact balance and slip. Continue lifting only while both contacts remain and slip is low; use another explicit adaptive close or plan a regrasp when contact weakens.
      After lifting while maintaining stable bilateral contact, call open_gripper(adaptive=True) to release the can so it can settle upright on the table. Do not call home_pose before releasing it. End the program after the release.
      Use the high-level FrankaControlApi functions only for motion: get_object_pose, sample_grasp_pose, goto_pose, open_gripper, close_gripper, home_pose.
      Do not call low-level UniVTAC movement functions such as move_delta_ee, move_ee, or move_qpos.
      Use UniVTAC native tactile observations only. Do not use robosuite or MuJoCo contact proxy tactile APIs.
      Do not use reward, success, task_completed, or trial id as runtime observations.
      Do not inspect private task fields, hidden object attributes, metadata, or labels.
      Do not load or call UniVTAC ACT or ViTAL policies.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/univtac_lift_can_tactile
trial_timeout_seconds: 240
max_trial_retries: 1
