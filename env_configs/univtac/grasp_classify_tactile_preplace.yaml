env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: /mnt/sdc/ljz/UniVTAC
      task_name: grasp_classify
      task_config: smoke_capx
      seed_base: 0
      device: cuda:0
      api_configs:
        franka_control_api:
          min_safe_z: 0.10
          max_delta_xyz: 0.04
          max_delta_rpy: 0.25
          max_delta_gripper: 0.02
          default_z_approach: 0.10
          release_hover_height: 0.10
          preserve_landmark_orientation: true
          use_task_place_actor_for_landmarks: false
          placement_xy_tolerance: 0.08
          placement_time_dilation_factor: 0.5
          placement_pre_dis: 0.0
          placement_dis: 0.0
          gripper_settle_steps: 10
          use_task_grasp_actor_for_prism: false
          object_pose_names:
            orange pad: orange_pad
            orange_pad: orange_pad
            green pad: green_pad
            green_pad: green_pad
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis:
      - FrankaControlApi
      - UniVTACTactileApi
    prompt: |
      You are controlling a Franka robot inside UniVTAC.
      Task: the robot starts with a prism already grasped. Use UniVTAC native tactile feedback to classify the prism, then place a rough prism on the orange pad and a plain prism on the green pad.
      The orange pad is near position [0.40, -0.08, 0.025]. The green pad is near position [0.40, 0.08, 0.025].
      Pad poses from get_object_pose describe the object placement target, not a manually offset release height.
      The prism is already grasped at the start. Do not reopen or re-grasp unless tactile contact is lost.
      Prefer a short sequence: read tactile summary/images, infer rough vs plain from native tactile cues, choose the orange_pad or green_pad pose, call goto_pose directly on that pad position with z_approach=0.1, then open_gripper.
      Use the high-level FrankaControlApi functions only for motion: get_object_pose, sample_grasp_pose, goto_pose, open_gripper, close_gripper, home_pose.
      Do not call low-level UniVTAC movement functions such as move_delta_ee, move_ee, or move_qpos.
      Use only UniVTAC native observations and tactile APIs.
      Use UniVTAC native tactile observations only. Do not use robosuite/MuJoCo contact proxy tactile APIs.
      Do not use reward, success, task_completed, or trial id as runtime observations.
      Do not inspect UniVTAC private task fields such as choice, target, prism, actor names, or any label that directly reveals the class.
      Do not call or depend on UniVTAC ACT/ViTAL policies.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/univtac_grasp_classify_tactile
trial_timeout_seconds: 180
max_trial_retries: 1
