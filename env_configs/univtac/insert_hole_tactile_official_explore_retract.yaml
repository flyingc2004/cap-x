# Explore-retract-insert variant of insert_hole_tactile_official.yaml.
#
# Two-phase strategy: (1) EXPLORATION tolerates brief wall contact -- slip /
# high shear is treated as direction information, not immediate failure; the
# agent records which pitch/lateral direction reduces slip, improves the
# pitch_cue, or changes guard_stop_phase; (2) RETRACT back to the pre-explore
# relative pose using move_relative(-accumulated_xyz, -accumulated_rpy,
# tactile_guard=False), then perform a clean guarded insertion along the
# learned direction.
#
# Differences from the base config (all other keys identical):
#   - prompt: strategy paragraphs replaced with the explore/retract protocol
#   - output_dir: *_explore_retract suffix
#   - trial_timeout_seconds: 600 (unchanged from base)
env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: /mnt/sdc/ljz/UniVTAC
      task_name: insert_hole
      task_config: smoke_capx_insert_hole_official
      seed_base: 0
      device: cuda:0
      api_configs:
        franka_control_api:
          min_safe_z: 0.05
          max_delta_xyz: 0.01
          max_delta_rpy: 0.25
          default_z_approach: 0.0
          home_pose_relative_lift: false
          preserve_landmark_orientation: false
          use_task_place_actor_for_landmarks: false
          use_task_grasp_actor_for_objects: false
          use_native_pose_planner: false
          rgbd_perception_enabled: false
          tactile_adaptive_gripper_enabled: true
          min_adaptive_close_force: 0.8
          max_insert_actions: 80
          move_relative_max_lateral: 0.0005
          move_relative_max_rotation: 0.15
          move_relative_lateral_budget: 0.006
          move_relative_rotation_budget: 1.20
          move_relative_lock_on_guard_failure: true
          insert_depth_log_interval: 50
          tactile_guard:
            slip_warning_threshold: 0.45
            slip_high_threshold: 0.68
            slip_hard_threshold: 0.72
            centroid_warning_delta: 2.0
            centroid_high_delta: 4.0
            shear_warning_delta: 0.05
            pitch_couple_sign: 1
            pitch_couple_threshold: 0.15
            pitch_confidence_threshold: 0.25
            guard_micro_down_step: 0.001
            guard_micro_lateral_step: 0.0002
            guard_micro_rpy_step: 0.003
            max_guarded_pitch_request: 0.15
            max_guarded_down_request: 0.008
          max_gripper_servo_steps: 120
          max_gripper_settle_steps: 20
          gripper_settle_steps: 10
          adaptive_gripper:
            coarse_qpos_step: 0.0005
            fine_qpos_step: 0.00005
            contact_debounce_frames: 2
            stable_debounce_frames: 3
            release_debounce_frames: 2
            settle_steps_per_command: 1
            contact_force_threshold: 0.08
            depth_contact_margin_mm: 0.5
            slip_threshold: 0.6
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis:
      - FrankaControlApi
      - UniVTACTactileApi
    prompt: |
      You are controlling a Franka robot in the official UniVTAC insert_hole evaluation protocol.
      Goal: insert the already grasped test tube into the hole while maintaining a stable grasp.
      The official reset and pre-move have already grasped the tube and brought it near the hole entrance. Start from the current state; do not re-grasp from the table, do not open the gripper, and do not use RGB-D relocation in this version.
      Use UniVTAC native tactile feedback as the main feedback signal. First make one adaptive preload close_gripper call with target_force around 0.8 and max_steps around 120. If the preload reports contact loss or unstable contact, finish normally. Otherwise keep the gripper closed throughout insertion.
      Strategy: explore-while-inserting. The tactile cue alone may not predict the correct direction, but slip, high shear, and one-sided pressure ARE strong feedback: they mean the tube is touching the hole wall, and the heavy quadrant tells you which side. Do not avoid contact -- and never end the episode just because a few directions did not help. Exploration has NO fixed candidate count: keep probing, correcting, and advancing while contact persists and the action budget remains.
      THE MAIN LOOP (one guarded move at a time, always forward-moving): every iteration starts with a small guarded downward step. Take get_tactile_summary(window=20) immediately before and after each move and judge the DELTA -- with contact present the risk label reads medium by default, so absolute labels are not a good filter; only changes count:
      - If the step executed (executed_depth increased) and the deltas are not getting worse, keep the current direction and take another step.
      - If the step was resisted -- guard stopped in the rotation or translation phase, slip_score rising, centroid displacement growing, or one pressure quadrant much heavier than before -- apply a correction to the approach direction: a small tilt and/or a small lateral nudge, opposite or orthogonal to the pressing side. Choose magnitudes qualitatively and shrink them as the tube goes deeper.
      - If a correction improves the deltas, keep applying it while it works. If it does not, reverse or orthogonalize it. If two consecutive attempts make zero downward progress, do a small unguarded retract (undo the recent corrections) and re-approach with a different direction. Retracts do not stop on slip but still consume the official action budget -- keep them small and rare.
      - When a correction or step clearly helps, print a stage line containing exactly "finds succeed" plus the direction name and the measured deltas (slip before/after, heavy quadrant), so progress is visible.
      Interpreting a blocked result: interrupted_by_slip_warning, direction_not_improving, preempted_by_slip_risk, completed_with_slip, and completed_unstable are all VALID outcomes, not program failures -- the touch itself is the signal. A result stopping in guard_stop_phase="rotation" means the tilt was resisted (try a smaller, mirrored, or orthogonal tilt). A result stopping in guard_stop_phase="translation" means downward motion was resisted by light wall contact, which the configured thresholds tolerate: do not push the same way again -- correct the direction first, then continue downward. Only stop inserting when the same blocked state has resisted several different corrections in a row.
      Reading the tactile map: use quadrant_pressure / quadrant_shear to infer which side of the hole wall presses the tube, and correct away from the heavy quadrant. Do not assume tactile left/right labels map directly to world x; choose directions by measured improvement. Use pitch_confidence only as a weak secondary cue, and only when it actually rises after a correction.
      Accumulate what was actually executed: probe_xyz += np.array(res["executed_xyz"]); probe_rpy += np.array(res["executed_rpy"]) for every move_relative call, and use these ledgers for unguarded retracts. These fields are exact -- the adapter records every executed micro-step even when the guard interrupts. NOTE: a pure rotation probe always reports executed_distance == 0 and executed_depth == 0 -- that does NOT mean nothing happened; check np.linalg.norm(res["executed_rpy"]) or res["executed_rotation"] > 0 for rotation probes.
      Budget (protocol facts, not suggestions): the official protocol allows 600 physical actions per episode (step_lim), and a single move_relative call executes at most 80 micro-steps -- enough for hundreds of guarded steps, so keep exploring freely. Two per-episode budgets are consumed one-way and never refill, and retracts count against them too: lateral motion 0.006 m total, rotation 1.2 rad total. Prefer tilts over lateral translation, and small repeated corrections over large ones. If a call returns clip_reason containing "lateral_budget" or "rotation_budget", that axis is exhausted for the whole episode -- do not keep trying in that axis, but keep using the other axes.
      A probe is valid when clipped is false AND at least one of: executed_distance > 0 (translation), executed_depth > 0 (downward), or np.linalg.norm(executed_rpy) > 0 (rotation). Use res["executed_xyz"] and res["executed_rpy"] (always present) for accumulation.
      NULL-SAFETY RULES (mandatory, they prevent crashes): fields reason, clip_reason, and guard_stop_phase can be None -- a probe with no clipping returns clip_reason=None and guard_stop_phase="none". Python's dict .get(key, default) does NOT fall back when the key exists with value None, so write checks as: if res.get("clip_reason") is not None and "lateral_budget" in res["clip_reason"]: ... or simpler: if "lateral_budget" in (res.get("clip_reason") or ""): ... . Never write `"text" in res["reason"]` or `"text" in res.get("reason")` directly -- wrap with (res.get("reason") or "") first. The same applies to guard_stop_phase: compare with == "rotation"/"translation"/"none" after (res.get("guard_stop_phase") or "none").
      Continue while contact remains present, episode_stopped is false, success_latched is false, and remaining_actions is positive (print remaining_actions from time to time). Rely on success_latched or episode_stopped as the official completion signal. Do NOT finish with a no_progress stop: as long as contact persists and actions remain, keep alternating small guarded downward steps with direction corrections, even if progress is slow. Print a compact final stop reason such as success_latched, episode_stopped, contact_lost, budget_exhausted, stuck_high_slip, or safety_loop_done before the code ends.
      Do not raise, assert, SystemExit, exit, quit, sleep in a no-action loop, or open the gripper for expected physical failure. Keep the gripper closed at the end. Do not call open_gripper() or home_pose().
      Write executable top-level Python code. If you define helper functions, call them before the code block ends; do not only define a function.
      Use only the exposed high-level FrankaControlApi functions and UniVTAC native tactile functions. Do not call low-level movement functions.
      Never inspect private simulator internals, hidden labels, evaluator state, or episode identifiers. Do not load or call ACT or ViTAL policies.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/univtac_insert_hole_tactile_official_explore_retract
trial_timeout_seconds: 600
max_trial_retries: 1
