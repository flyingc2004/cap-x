# Historical entrypoint retained for existing run scripts. It uses the same
# response-vector selection-only protocol as tactile_memory_match_easy_sam_gt.
env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    stream_user_code_output: false
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: ${oc.env:UNIVTAC_ROOT,/mnt/sdc/ljz/UniVTAC}
      task_name: tactile_memory_match
      task_config: tactile_memory_match_composable_capx_demo
      seed_base: 4001
      device: cuda:0
      live_preview_enabled: true
      live_preview_path: ${oc.env:CAPX_LIVE_PREVIEW_PATH,/tmp/capx_tactile_response_preview.jpg}
      live_preview_stride: 5
      live_preview_jpeg_quality: 85
      memory_overlay_enabled: true
      selection_only_audit: true
      task_config_overrides:
        record_video_during_reset: false
        record_action_frames: true
        record_pre_move_frames: false
        record_pre_move_tactile_timeline: false
        skip_pre_move_render: true
        skip_task_pre_move: true
        video_frame_stride: 4
      api_configs:
        franka_control_api:
          llm_api_profile: tactile_memory_match
          llm_visible_functions: [get_object_pose, sample_grasp_pose, goto_pose, move_delta, open_gripper, close_gripper, wait_steps]
          local_delta_max_m: 0.02
          local_delta_segment_m: 0.002
          local_wait_max_steps: 20
          public_anchor_pose_enabled: true
          public_grasp_anchor_objects: [reference_object, candidate_left, candidate_right]
          public_pose_fallback_objects: [reference_object, candidate_left, candidate_right, match_slot]
          official_anchor_fallback_enabled: false
          rgbd_perception_enabled: false
          rgbd_pose_enabled: false
          rgbd_grasp_enabled: false
          use_native_pose_planner: true
          use_task_grasp_actor_for_objects: true
          tactile_adaptive_gripper_enabled: true
          object_pose_names:
            reference_object: reference_object
            candidate_left: candidate_left
            candidate_right: candidate_right
            match_slot: match_slot
        univtac_tactile_api:
          llm_visible_functions: [get_public_probe_spec, begin_public_probe_capture, begin_public_probe_segment, end_public_probe_segment, finalize_public_probe_capture, get_tactile_response_expression, is_contacting, is_slipping, is_grasp_stable, write_trial_memory, read_trial_memory, list_trial_memory]
          tactile_response_expression_path: ${oc.env:CAPX_TACTILE_RESPONSE_EXPRESSION,task_config/tactile_response_expression.v1.json}
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis: [FrankaControlApi, UniVTACTactileApi]
    prompt: |
      Execute only a public tactile response selection. Read get_public_probe_spec and get_tactile_response_expression once. Probe reference_object, candidate_left, then candidate_right with the unchanged public protocol: side-grasp approach, adaptive probe close, bilateral preload capture, lift-motion capture, hold capture, lower, release, and clearance. Record each complete tactile_probe.v4 as trial_memory.v1 evidence. Use only the expression's public response blocks, transforms, fixed Median/IQR scalers, and quality-weighted block RMS rule to select the lower-distance candidate. Write a trial_memory.v1 selection record with block distances, confidence, scores, margin, rationale, provenance, and selected_candidate. Never read private fields. Never transport an object. On invalid evidence print CAPX_FAILURE; otherwise print CAPX_SELECTION and finish.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/univtac_tactile_response_selection
trial_timeout_seconds: 1200
max_trial_retries: 1
max_regenerations: 1
multi_turn_on_failure_only: true
filter_multiturn_console: true
multiturn_console_max_lines: 35
multiturn_console_max_chars: 5000
tactile_memory:
  trial:
    enabled: true
    include_in_multiturn: true
    max_context_chars: 4000
  persistent:
    enabled: false
