# Provisional single-seed engineering demo. It demonstrates the complete
# measurement -> trial memory -> fixed public expression -> selection ->
# transport loop; it is not a multi-slot generalization result.
env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    stream_user_code_output: false
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: /mnt/sdc/ljz/UniVTAC
      task_name: tactile_memory_match
      task_config: tactile_memory_match_composable_capx_demo
      # trial 1 maps to task seed 4002; the left/right match assignment stays hidden.
      seed_base: 4001
      device: cuda:0
      live_preview_enabled: true
      live_preview_path: ${oc.env:CAPX_LIVE_PREVIEW_PATH,/tmp/capx_composable_demo_preview.jpg}
      live_preview_stride: 5
      live_preview_jpeg_quality: 85
      memory_overlay_enabled: true
      task_config_overrides:
        record_video_during_reset: true
        record_action_frames: true
        video_frame_stride: 4
      api_configs:
        franka_control_api:
          llm_api_profile: tactile_memory_match
          llm_visible_functions: [get_object_pose, sample_grasp_pose, goto_pose, move_delta, open_gripper, close_gripper, wait_steps]
          local_delta_max_m: 0.02
          local_delta_segment_m: 0.002
          local_wait_max_steps: 20
          profile_open_width: 1.0
          profile_open_max_steps: 120
          transport_close_target_force: 0.90
          transport_close_max_steps: 160
          min_safe_z: 0.035
          native_min_ee_z: 0.035
          default_z_approach: 0.04
          gripper_settle_steps: 10
          use_native_pose_planner: true
          use_task_grasp_actor_for_objects: true
          use_task_place_actor_for_landmarks: true
          task_place_landmark_names: [match_slot]
          task_native_safe_placement: true
          grasp_xy_tolerance: 0.08
          grasp_z_tolerance: 0.04
          grasp_pre_dis: 0.04
          grasp_dis: 0.0
          grasp_height: 0.04
          placement_xy_tolerance: 0.08
          placement_time_dilation_factor: 0.5
          public_anchor_pose_enabled: true
          public_grasp_anchor_objects: [reference_object, candidate_left, candidate_right]
          public_pose_fallback_objects: [reference_object, candidate_left, candidate_right, match_slot]
          official_anchor_fallback_enabled: false
          rgbd_perception_enabled: false
          rgbd_pose_enabled: false
          rgbd_grasp_enabled: false
          max_goto_pose_actions: 90
          max_home_pose_actions: 20
          max_native_pose_actions: 2
          max_gripper_servo_steps: 160
          min_open_gripper_servo_steps: 80
          max_gripper_settle_steps: 20
          goto_pose_tactile_guard_force_threshold: 0.45
          goto_pose_tactile_guard_slip_threshold: 0.45
          tactile_adaptive_gripper_enabled: true
          adaptive_gripper:
            coarse_qpos_step: 0.0005
            fine_qpos_step: 0.00005
            contact_debounce_frames: 2
            stable_debounce_frames: 3
            release_debounce_frames: 2
            settle_steps_per_command: 1
            contact_force_threshold: 0.08
            contact_balance_threshold: 0.50
            depth_contact_margin_mm: 0.5
            slip_threshold: 0.60
            target_depth_delta_mm: 5.0
            min_stable_contact_area: 0.006
            post_squeeze_qpos: 0.00015
            post_squeeze_steps: 4
            hold_steps: 8
          object_pose_names:
            reference: reference_object
            reference_object: reference_object
            candidate_left: candidate_left
            candidate_right: candidate_right
            match_slot: match_slot
            target_slot: match_slot
            slot: match_slot
        univtac_tactile_api:
          llm_visible_functions: [get_public_probe_spec, begin_public_probe_capture, begin_public_probe_segment, end_public_probe_segment, finalize_public_probe_capture, get_provisional_slot_expression, is_contacting, is_slipping, is_grasp_stable, write_trial_memory, read_trial_memory, list_trial_memory]
        tactile_slot_expression:
          schema_version: provisional_slot_expression.v0
          confidence:
            bilateral_ratio_windows: [preload, lift_motion]
            snr_cap: 10.0
          slots:
            weight:
              feature_paths: [lift_minus_preload.left.marker_displacement_px, lift_minus_preload.right.marker_displacement_px, lift_minus_preload.left.marker_coherence, lift_minus_preload.right.marker_coherence]
            roughness:
              feature_paths: [lift_minus_preload.left.marker_displacement_px, lift_minus_preload.right.marker_displacement_px, lift_minus_preload.left.marker_coherence, lift_minus_preload.right.marker_coherence]
            hardness:
              feature_paths: [lift_minus_preload.left.depth_mm, lift_minus_preload.right.depth_mm, lift_minus_preload.left.marker_displacement_px, lift_minus_preload.right.marker_displacement_px, lift_minus_preload.left.marker_coherence, lift_minus_preload.right.marker_coherence]
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis: [FrankaControlApi, UniVTACTactileApi]
    prompt: |
      You control a provisional composable-slot Easy-GT engineering demo in UniVTAC tactile_memory_match. The task fixes a same-mesh reference/match pair and a same-mesh distractor, but the side assignment and all identity labels are hidden. Use public reset anchors only for coarse motion. Decide identity only from public tactile_probe.v3 values; never read metadata, labels, density, friction, hardness, reward, success, actor state, private task fields, or direct environment objects. This is an engineering demo, not a generalization claim.

      Read get_public_probe_spec() and get_provisional_slot_expression() once, then write the unchanged probe spec as a trial_memory.v1 state record named probe_spec. The public probe spec owns all timing, lift, hold, quality, and action values: do not substitute numerical values in code. Define exactly one probe(object_name) helper and call it in this order: reference_object, candidate_left, candidate_right. Reuse the identical probe spec for all three objects.

      In probe(object_name), execute the expert-aligned public chain yourself. Open the gripper, obtain sample_grasp_pose(object_name), and goto_pose the returned side-grasp pose. Start begin_public_probe_capture(object_name). Close with close_gripper(mode="probe") and require is_grasp_stable(). Start a preload segment, wait the protocol preload duration, and end it. Require the returned preload bilateral quality gate. Start a lift_motion segment, move_delta by the protocol lift height, then end it. Start a hold segment, wait the protocol hold duration, and end it. Require stable non-slipping bilateral contact throughout the lift/hold. Lower by the exact negative protocol lift height and wait the protocol lower settling duration. Open, confirm release with is_contacting(), and let the next sampled side-grasp route provide clearance before the next object. Finalize the recorder with finalize_public_probe_capture(capture_id, execution_flags). It returns tactile_probe.v3, including preload, lift_motion, hold, lift_minus_preload, and public quality. If any quality gate fails, print CAPX_FAILURE reason=insufficient_tactile_evidence and stop without guessing.

      Write trial_memory.v1 evidence records named evidence_reference, evidence_candidate_left, and evidence_candidate_right. Each record must contain its complete tactile_probe.v3, slot vectors, per-slot confidence, protocol provenance, and validity. Build every slot vector only from the feature paths in provisional_slot_expression.v0. Compute each slot confidence in [0,1] from the probe's bilateral contact ratios and the relevant public SNR values. Do not merge weight and roughness silently: record both contributions independently even though v0 intentionally shares their marker-delta family.

      After all three valid evidence records exist, read them and compute the fixed v0 comparison in code. For each valid slot and each feature, use this trial's symmetric scale max(abs(left-reference), abs(right-reference), epsilon), then compute a normalized L2 distance for reference-left and reference-right. Fuse only valid slots using fused_distance = sum(slot_confidence * slot_distance) / sum(slot_confidence). Write a trial_memory.v1 decision record named selection with per-slot left/right distances, confidences, fused score_left, score_right, score_margin, selected_candidate, rule version, and rationale. Select the lower fused score only.

      Final transport must be independent from probing. Sample and side-grasp the selected candidate again, close_gripper(mode="transport"), and require a fresh stable bilateral tactile grasp. Obtain the public match_slot anchor and goto_pose it. The adapter executes its safe clearance lift, horizontal slot-hover transport, vertical descent, release, and retreat. If tactile contact weakens, slips, rotates, or drops before release, print CAPX_FAILURE and stop. Print CAPX_SUCCESS only after release verification. Return concise executable Python only.
    multi_turn_prompt: |
      Executed code:
      {executed_code}

      Console stdout:
      {console_stdout}

      Console stderr:
      {console_stderr}

      This is failure-only recovery. Preserve the simulator state and injected agent-authored trial memory. Do not replay a valid probe, change probe_spec, consult private data, or recompute identity using vision. Read existing evidence and selection before acting. If no valid continuation remains, print CAPX_FAILURE and finish. If the only failure is final transport, regenerate only a concise independent transport regrasp-or-stop continuation. Do not add exploratory loops.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/univtac_tactile_memory_match_composable_demo
trial_timeout_seconds: 1500
max_trial_retries: 1
max_regenerations: 1
save_multiturn_prompts: true
split_code_blocks_on_breakpoint: true
multi_turn_on_failure_only: true
regenerate_full_chain_on_static_failure: true
filter_multiturn_console: true
multiturn_console_max_lines: 35
multiturn_console_max_chars: 5000
multiturn_console_keep_recent_other: 5
multiturn_executed_code_max_chars: 6000
multiturn_remaining_code_max_chars: 3000
tactile_memory:
  trial:
    enabled: true
    include_in_multiturn: true
    max_context_chars: 4000
  persistent:
    enabled: false
