env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: /mnt/sdc/ljz/UniVTAC
      task_name: insert_hole
      task_config: smoke_capx_insert_hole_official
      seed_base: 0
      device: cuda:0
      api_configs:
        franka_control_api:
          min_safe_z: 0.05
          max_delta_xyz: 0.01
          max_delta_rpy: 0.25
          default_z_approach: 0.0
          home_pose_relative_lift: false
          preserve_landmark_orientation: false
          use_task_place_actor_for_landmarks: false
          use_task_grasp_actor_for_objects: false
          use_native_pose_planner: false
          rgbd_perception_enabled: false
          tactile_adaptive_gripper_enabled: true
          max_insert_actions: 20
          move_relative_max_lateral: 0.0005
          move_relative_max_rotation: 0.012
          move_relative_lateral_budget: 0.006
          move_relative_rotation_budget: 1.20
          move_relative_lock_on_guard_failure: true
          insert_depth_log_interval: 50
          tactile_guard:
            slip_warning_threshold: 0.35
            slip_high_threshold: 0.55
            slip_hard_threshold: 0.60
            centroid_warning_delta: 0.5
            centroid_high_delta: 1.0
            shear_warning_delta: 0.05
            guard_micro_down_step: 0.001
            guard_micro_lateral_step: 0.0002
            guard_micro_rpy_step: 0.002
          max_gripper_servo_steps: 120
          max_gripper_settle_steps: 20
          gripper_settle_steps: 10
          adaptive_gripper:
            coarse_qpos_step: 0.0005
            fine_qpos_step: 0.00005
            contact_debounce_frames: 2
            stable_debounce_frames: 3
            release_debounce_frames: 2
            settle_steps_per_command: 1
            contact_force_threshold: 0.08
            depth_contact_margin_mm: 0.5
            slip_threshold: 0.6
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis:
      - FrankaControlApi
      - UniVTACTactileApi
    prompt: |
      You are controlling a Franka robot in the official UniVTAC insert_hole evaluation protocol.
      Goal: insert the already grasped test tube into the hole while maintaining a stable grasp.
      The official reset and pre-move have already grasped the tube and brought it near the hole entrance. Start from the current state; do not re-grasp from the table, do not open the gripper, and do not use RGB-D relocation in this version.
      Use UniVTAC native tactile feedback as the main feedback signal. Before inserting, check whether the held tube is still stable. If tactile contact is weak, one-sided, or slipping, you may use one adaptive close_gripper call to improve the hold; if the grasp remains unstable, finish normally.
      Use move_relative for all physical motion, and use its documented return status together with native tactile feedback to decide each next move. Keep insert_hole motions at the contact servo scale: normal guarded downward insertion steps should be 0.001 m, fallback/test downward steps can be 0.0003-0.0005 m, lateral probes should be no larger than 0.0005 m, and pitch or roll probes should be no larger than 0.006 rad. The small 0.0003 m step is appropriate for high-risk confirmation, but once a useful direction is found or several protected steps make progress with low drift, increase the requested down-step to 0.001 m or 0.002 m. You may read result["limits"] after any move_relative call to confirm these limits.
      Treat recoverable tactile guard signals such as reason="preempted_by_slip_risk", reason="interrupted_by_slip_warning", reason="completed_with_slip", clipped commands, or correction-budget exhaustion as physical feedback, not program failure. When reason="interrupted_by_slip_warning" but result["executed_depth"] > 0, count it as protected insertion progress, not as a consecutive failure. If this protected progress repeats while drift is low and contact is stable, keep using 0.001 m requests because the adapter is safely regulating the actual micro-motion. When these signals appear without progress, stop pushing in the same way, make a smaller or different corrective probe, and then test insertion cautiously again.
      Use tactile["slip_risk"] as a string label: "low", "medium", or "high", and use tactile["correction_hint"] to choose between continue, reduce_down_step, try_pitch_probe, try_lateral_probe, and hold. If slip_risk is low and contact is stable, continue 0.001 m guarded downward insertion, and after two stable guarded insertions you may request 0.002 m. If slip_risk is medium but drift is low and executed_depth stays positive, continue 0.001 m guarded down-steps instead of shrinking further. If slip_risk is high, do not keep inserting downward; use the tactile hint to choose one small pitch or lateral correction probe.
      The official insert_hole task mainly needs pitch-aligned insertion around the robot-base/world y axis. Prefer paired pitch probes before lateral probes. Use lateral probes only when tactile pressure or shear consistently points to a side, and keep every correction within the move_relative limits.
      Implement correction probes as a tiny search with memory, not as a fixed side mapping. Store the tactile state before each probe, run one small legal probe, then judge the probe primarily from the returned move_relative result, especially result["risk_before"], result["risk_after"], result["reason"], result["tactile"], and result["executed_depth"]. Do not call get_tactile_summary again to override a better result from the move you just made; use an extra summary only as confirmation. A probe is useful if result["risk_before"] is "high" and result["risk_after"] becomes "medium" or "low", if result["tactile"]["slip"] becomes False after slip was present, if drift decreases, or if correction_hint moves toward reduce_down_step or continue. A result with reason="completed_with_slip" can still be a useful correction when risk or drift improves. If a probe is clipped, hits a correction budget, or does not improve the tactile state, undo or reverse it once and do not repeat that same direction at the same scale.
      After a probe direction clearly improves tactile state, lock that direction temporarily instead of searching from scratch every cycle. When a direction is locked, immediately print a stage line containing exactly "finds succeed" plus the direction name and current tactile risk, and reset any local consecutive-failure counter. While the locked direction keeps tactile risk low or decreasing, combine a tiny correction in that direction with 0.001 m guarded downward insertion. After two consecutive stable guarded insertions, you may request a larger down command such as 0.002 m; the adapter will still execute it as guarded micro-steps and interrupt if slip risk rises.
      For high slip risk, try paired pitch probes first: test one pitch direction, undo or reverse it if it does not improve, then test the opposite pitch direction. Only after pitch fails should you test paired lateral probes such as +x/-x and, if needed, +y/-y. Never repeat the same pitch or lateral direction twice in a row after it failed to improve. If a probe reduces high risk to medium, immediately print "finds succeed", lock that direction, and resume cautious insertion instead of trying the remaining probes. If risk stays medium for many steps, drift remains low, and insertion progress is too slow, run one small probe search anyway to find a better direction. Do not assume tactile left/right labels directly map to a world x direction; choose the next direction from measured improvement.
      After any useful correction, test insertion with one very small guarded downward move. Prefer the returned result["tactile"] and result["executed_depth"] for this decision; use an extra tactile summary only as confirmation because a single windowed high-risk reading can be transient. If the test reports slip or higher risk, treat it as a recoverable warning: stop pushing downward, choose a different correction direction, and avoid repeating the failed probe. Do not stop immediately after "finds succeed" unless contact is lost, the episode stops, or several different correction directions produce no improvement and no executed_depth progress. If all paired pitch and lateral probes fail to improve high slip risk, finish normally with stop reason "stuck_high_slip" rather than exhausting the motion budget.
      Continue cautious insertion while contact remains present, official success has not latched, the episode has not stopped, remaining_actions is available, and no hard API failure has occurred. Use remaining_actions to avoid exhausting the official budget, and rely on success_latched or episode_stopped as the official completion signal. Initialize any local stop_reason to "safety_loop_done" or "running", never to "budget_exhausted". Only print "budget_exhausted" when an API result explicitly reports remaining_actions <= 0. If probes fail to improve tactile state but remaining_actions is still positive, either continue cautious insertion if tactile risk is medium/low, or finish with "stuck_high_slip" or "no_progress", not "budget_exhausted". Print a compact final stop reason such as success_latched, episode_stopped, contact_lost, hard_failure, budget_exhausted, stuck_high_slip, no_progress, or safety_loop_done before the code ends.
      Do not raise, assert, SystemExit, exit, quit, sleep in a no-action loop, or open the gripper for expected physical failure. Keep the gripper closed at the end. Do not call open_gripper() or home_pose().
      Write executable top-level Python code. If you define helper functions, call them before the code block ends; do not only define a function.
      Use only the exposed high-level FrankaControlApi functions and UniVTAC native tactile functions. Do not call low-level movement functions.
      Never inspect private simulator internals, hidden labels, evaluator state, or episode identifiers. Do not load or call ACT or ViTAL policies.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/univtac_insert_hole_tactile_official
trial_timeout_seconds: 600
max_trial_retries: 1
