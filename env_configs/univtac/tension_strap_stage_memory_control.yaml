# One-process, one-seed CaP-X control run for ViTaForge's tension_strap task.
env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    stream_user_code_output: false
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: ${oc.env:UNIVTAC_ROOT,/mnt/sdc/ljz/ViTaForge_capx_tension}
      task_name: tension_strap
      task_config: tension_strap
      force_task: true
      force_task_seed: ${oc.env:CAPX_FORCE_TASK_SEED,1}
      seed_base: ${oc.env:CAPX_FORCE_TASK_SEED,1}
      device: cuda:0
      live_preview_enabled: true
      live_preview_path: ${oc.env:CAPX_LIVE_PREVIEW_PATH,/tmp/capx_tension_strap_preview.jpg}
      live_preview_stride: 5
      live_preview_jpeg_quality: 85
      video_renderer: task_native
      tension_response_panel:
        enabled: true
        history_points: 360
      # Adapter pre-move is benchmark initialization, not agent behavior. Rendering
      # the 1600x1200 dashboard and extracting a tactile timeline at every
      # pre-move physics step consumed most of the outer process watchdog.
      # Start recording at the post-reset agent state instead.  The task runs
      # at 60 Hz, so stride 2 preserves real-time playback at the writer's
      # 30 FPS while cutting dashboard rendering and encoding in half.
      task_config_overrides:
        task_cfg_overrides:
          save_pre_move: false
        record_video_during_reset: false
        record_pre_move_frames: false
        record_pre_move_tactile_timeline: false
        video_frame_stride: 2
        force_task_adapter_pre_move: true
      runtime_preflight:
        enabled: true
        tacex_root: ${oc.env:TACEX_RUNTIME_ROOT,/mnt/sdc/ljz/ViTaForge_capx_tension/third_party/TacEx}
        require_contact_gradient: true
        require_attached_gelpad_asset: true
        require_attachment_points: true
      api_configs:
        franka_control_api:
          llm_api_profile: opentac_tension_control
          llm_visible_functions: [move_delta, open_gripper, close_gripper, get_robot_state, wait_steps]
          tactile_adaptive_gripper_enabled: true
          use_native_pose_planner: false
          local_delta_max_m: 0.001
          local_delta_segment_m: 0.001
          force_task_target_lead_m: 0.002
          min_safe_z: 0.10
          max_gripper_servo_steps: 160
          adaptive_gripper:
            # The public expert accepts the grasp at 27.6 mm raw depth with a
            # 34 mm calibrated far plane, i.e. at least 6.4 mm indentation.
            target_depth_delta_mm: 6.4
            min_stable_contact_area: 0.006
            post_squeeze_qpos: 0.00015
            post_squeeze_steps: 4
            hold_steps: 8
        opentac_api:
          llm_visible_functions: [get_tactile_tension_control_contract, begin_tactile_tension_estimator, get_tactile_tension_estimate, get_tactile_stage_memory, capture_tactile_stage_response]
          tension_calibration_path: task_config/force_task_rgb/tension_strap_dual_stage.json
          tactile_stage_memory_path: env_configs/univtac/tactile_response_memory/tension_strap_12n_18n.v2.json
          max_delta_z_m: 0.001
          observation_wait_steps: 2
          observation_dt_s: 0.016666666666666666
          stage_hold_seconds: 3.0
          estimator_settle_steps: 30
          proportional_delta_gain_m_per_N: 0.00008333333333333333
          stage_targets_N: [12.0, 18.0]
          stage_tolerance_N: 0.5
          estimator_update_stride: 1
          max_estimate_age_steps: 3
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis: [FrankaControlApi, OpenTacApi]
    prompt: |
      Complete this public tension-strap task using only the documented functions from FrankaControlApi and OpenTacApi. The documented API names are already injected as top-level Python functions. Call them directly, for example close_gripper(...), get_tactile_tension_estimate(), and move_delta(dz=...). Do not import API modules, instantiate FrankaControlApi/OpenTacApi, use APIS, or access env directly.

      Task objective: keep the same grasp throughout two ordered tension stages. First control the public estimated_tension_N into the 12 N target band [11.5, 12.5], then without opening or regrasping control it into the 18 N target band [17.5, 18.5]. Tension is a tolerance-band requirement: do not chase an exact 12.000 or 18.000 value once the public estimate is inside its band. Time is a strict continuous requirement: each stage must remain inside its band for one uninterrupted full 3.0-second window. Do not begin the 18 N stage until the full 12 N hold has completed. Do not end after only the first stage. Do not read or infer simulator true tension, actor state, reward, success, task metadata, private task fields, or direct environment objects.

      The CaP-X adapter has already brought the open gripper to the public non-contact strap approach. First call close_gripper(adaptive=True). Treat bilateral contact as grasp evidence; stable=false alone is not a reason to abort when the result reports bilateral contact. Wait contract["estimator_settle_steps"] without moving, then call begin_tactile_tension_estimator() once. Do not open or regrasp between the ordered 12 N and 18 N stages unless your own code decides that the physical grasp is lost.

      Call get_tactile_tension_control_contract() and get_tactile_stage_memory() before control. The contract gives public target bands, sampling cadence, hold duration, motion safety range, and proportional gain. The adapter does not track stage progress, action counts, failure counts, or recovery decisions. Maintain your own local stage index, in-band elapsed time, and any retry/recovery state in the generated code. Control the two public stages in the fixed order: first 12 N, then 18 N. Read the exact band from contract["stage_bands_N"][stage_index]; do not derive another band. Positive move_delta(dz) pulls upward and increases tension; negative dz relaxes the strap. The 18 N stage requires an additional upward motion after the 12 N hold; no API performs this automatically.

      get_tactile_tension_estimate() is only a public numerical observation. When estimate["available"] is true, use estimate["estimated_tension_N"]. When available is false, the estimate is temporarily unavailable: do not treat it as task failure and do not move from an unobserved estimate. Wait and sample again, or use a locally chosen recovery such as settling or re-establishing a grasp. The adapter never provides a consecutive-failure count, a failure reason, a completed-stage flag, or a prescribed recovery. Keep any local wait/retry loop finite and make the eventual stop/recovery choice yourself.

      For each stage, sample at the public cadence. Add elapsed time only after an available estimate is inside the exact band. Reset that stage's local elapsed time to zero on every unavailable or out-of-band sample; never join separated in-band intervals. When outside the band, calculate a proportional dz = clip((target - estimated_tension_N) * contract["proportional_delta_gain_m_per_N"], -contract["max_delta_z_m"], contract["max_delta_z_m"]), move once, then wait and sample again. When inside the band, do not move; wait and continue sampling until your own accumulated elapsed time reaches contract["stage_hold_seconds"].

      Immediately after each locally completed 3-second hold, call capture_tactile_stage_response() and require response["quality"]["valid"] is true. Do not guess the frozen-memory schema. It is exactly memory["stages"], a list with two records whose identifiers are stage["memory_id"] == "tension_strap_hold_12n.v1" and "tension_strap_hold_18n.v1". Each stage record has stage["response_blocks"], not "blocks". There is no stage "name" or "id" field to search for. Select each stage by its exact memory_id.

      Build the 10 public response values in these three fixed blocks: normal_static = [response["hold"]["left"]["depth_mm"], response["hold"]["right"]["depth_mm"]]; normal_dynamic = [response["end_minus_start"]["left"]["depth_mm"], response["end_minus_start"]["right"]["depth_mm"]]; surface_spatial_static = [left/right marker_row_gradient_px, left/right marker_col_gradient_px, log(left marker_anisotropy_ratio), log(right marker_anisotropy_ratio)] from response["hold"]. For block index i, compare these values with stage["response_blocks"][i]["scaler"]["median"] and the same-index shared pooled-calibration IQR at memory["retrieval_scaler"]["response_blocks"][i]["iqr"]. The block distance is RMS((value - median) / IQR); the fused stage distance is the arithmetic mean of its three block distances. The response must be closer to tension_strap_hold_12n.v1 after the 12 N hold, and closer to tension_strap_hold_18n.v1 after the 18 N hold. Print CAPX_STAGE with the stage, both fused distances, and margin. The frozen response memory verifies the completed stage; it does not control motion for you.

      Every submitted or regenerated code block must be independently executable. At the top of any block that uses them, retrieve contract and memory again; never rely on variables created by an earlier code block. The adapter has no persisted stage checkpoint, so a recovery block must not claim a previous stage completed unless its own code has established that fact. On a deliberate failure, print CAPX_FAILURE and raise RuntimeError without catching or swallowing it. Do not wrap the main program in `except SystemExit: pass` or a broad exception handler that turns a failure into apparent success.

      Advance only after both the local physical hold and its matching 10D response are valid. At 18 N, remain at the final pose until its hold and response are complete, then end normally. Return concise executable Python only.
    multi_turn_prompt: |
      Executed code:
      {executed_code}

      Console stdout:
      {console_stdout}

      Console stderr:
      {console_stderr}

      This is failure-only recovery. The appended OpenTac context is only the latest public numerical estimate; it has no stage checkpoint or recovery verdict. Do not infer completed holds from it. The documented functions are already injected as top-level names: do not import or instantiate API classes. The regenerated block must be independently executable: retrieve contract and memory again instead of assuming prior local variables exist. Select frozen stages only through memory["stages"][*]["memory_id"] and use response_blocks, never guessed name/id/blocks fields. Do not use private force signals or change the 12 N then 18 N target sequence.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/vitaforge_tension_strap_stage_memory_control
trial_timeout_seconds: 1200
max_trial_retries: 1
max_regenerations: 1
stop_multiturn_when_regeneration_exhausted: true
save_multiturn_prompts: true
split_code_blocks_on_breakpoint: true
multi_turn_on_failure_only: true
filter_multiturn_console: true
multiturn_console_max_lines: 10
multiturn_console_max_chars: 1000
multiturn_console_keep_recent_other: 0
multiturn_executed_code_max_chars: 3000
multiturn_remaining_code_max_chars: 1000
include_trial_memory_in_multiturn: true
multiturn_trial_memory_max_chars: 1000
tactile_memory:
  trial:
    enabled: false
    include_in_multiturn: false
  persistent:
    enabled: false
