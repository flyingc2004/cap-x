# One-process, one-seed CaP-X control run for ViTaForge's tension_strap task.
env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    stream_user_code_output: false
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: ${oc.env:UNIVTAC_ROOT,/mnt/sdc/ljz/ViTaForge}
      task_name: tension_strap
      task_config: tension_strap
      force_task: true
      force_task_seed: ${oc.env:CAPX_FORCE_TASK_SEED,1}
      seed_base: ${oc.env:CAPX_FORCE_TASK_SEED,1}
      device: cuda:0
      live_preview_enabled: true
      live_preview_path: ${oc.env:CAPX_LIVE_PREVIEW_PATH,/tmp/capx_tension_strap_preview.jpg}
      live_preview_stride: 5
      live_preview_jpeg_quality: 85
      # 120 Hz physics / 8 = 15 fps.  The video therefore preserves simulation
      # time while avoiding a full 1600x1200 dashboard encode on every render.
      video_stream_fps: 15.0
      video_renderer: task_native
      tension_response_panel:
        enabled: true
        history_points: 360
      # Adapter pre-move is benchmark initialization, not agent behavior. Keep
      # the 60 Hz render cadence needed for tactile observations, but let
      # CaP-X own the sole encoded video stream at 15 fps.
      task_config_overrides:
        # Propagate the task's own success, grasp-loss, overload, travel-limit,
        # and 60-second physical timeout into the CaP-X control loop.
        official_task_protocol: true
        task_cfg_overrides:
          save_pre_move: false
        record_video_during_reset: false
        record_pre_move_frames: false
        record_pre_move_tactile_timeline: false
        # eval_test avoids BaseTask's unconditional eval render and its native
        # VideoHandler. render_frequency=2 is the public 60 Hz sensor cadence.
        runtime_task_mode: eval_test
        render_frequency: 2
        video_frequency: 0
        video_frame_stride: 8
        force_task_adapter_pre_move: true
      runtime_preflight:
        enabled: true
        tacex_root: ${oc.env:TACEX_RUNTIME_ROOT,/mnt/sdc/ljz/ViTaForge/third_party/TacEx}
        require_contact_gradient: true
        require_attached_gelpad_asset: true
        require_attachment_points: true
      api_configs:
        franka_control_api:
          llm_api_profile: opentac_tension_control
          llm_visible_functions: [move_delta, open_gripper, close_gripper, get_robot_state, wait_steps]
          tactile_adaptive_gripper_enabled: true
          use_native_pose_planner: false
          # Match the expert's capped 2 mm/s pull at its 60 Hz public cadence.
          # GPU load changes wall-clock time, not physical control velocity.
          local_delta_max_m: 0.00003333333333333333
          local_delta_segment_m: 0.00003333333333333333
          force_task_target_lead_m: 0.00003333333333333333
          min_safe_z: 0.10
          # The official public grasp has a 400-command budget, with two
          # physics ticks per command.  This is a budget, never a qpos goal.
          max_gripper_servo_steps: 400
          adaptive_gripper:
            # The public expert accepts the grasp at 27.6 mm raw depth with a
            # 34 mm calibrated far plane, i.e. at least 6.4 mm indentation.
            # Its depth-driven step is in [5e-6, 1e-4] m and each command runs
            # for two physics ticks.  The generic adapter has no remaining-
            # depth taper, so use the expert's 1e-4 m upper-rate bound for
            # both generic phases and let bilateral depth terminate closing.
            coarse_qpos_step: 0.0001
            fine_qpos_step: 0.0001
            settle_steps_per_command: 2
            contact_debounce_frames: 1
            stable_debounce_frames: 1
            contact_force_threshold: 0.0
            contact_balance_threshold: 1.0
            slip_threshold: 1.0
            one_sided_force_limit: 1.1
            target_depth_delta_mm: 6.4
            min_stable_contact_area: 0.0
            post_squeeze_qpos: 0.0
            post_squeeze_steps: 0
            hold_steps: 0
        opentac_api:
          llm_visible_functions: [get_tactile_tension_control_contract, begin_tactile_tension_estimator, get_tactile_tension_estimate, capture_tactile_stage_response]
          tension_estimator_mode: public_depth_marker_regression_v1
          tension_calibration_path: env_configs/univtac/tension_calibration/tension_strap_public_tactile_force_69seed.v1.json
          tactile_stage_memory_path: env_configs/univtac/tactile_response_memory/tension_strap_12n_18n.v2.json
          # Expert-equivalent P controller: clamp(error / 2000 m/s, +/-2 mm/s)
          # and apply it for two 120 Hz physics ticks per public action.
          max_delta_z_m: 0.00003333333333333333
          observation_wait_steps: 2
          observation_dt_s: 0.008333333333333333
          stage_hold_seconds: 3.0
          estimator_settle_steps: 30
          force_filter_time_constant_s: 0.15
          controller_deadband_N: 0.02
          proportional_delta_gain_m_per_N: 0.000008333333333333333
          stage_targets_N: [12.0, 18.0]
          stage_tolerance_N: 0.5
          estimator_update_stride: 1
          max_estimate_age_steps: 3
          # Evaluator-only: pairs public estimates with private physics in a
          # post-run artifact. It never enters an API response, prompt, video,
          # or control decision.
          private_force_audit:
            enabled: true
            sample_stride: 1
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis: [FrankaControlApi, OpenTacApi]
    prompt: |
      Complete this public tension-strap task using only the documented functions from FrankaControlApi and OpenTacApi. The documented API names are already injected as top-level Python functions. Call them directly, for example close_gripper(...), get_tactile_tension_estimate(), and move_delta(dz=...). Do not import API modules, instantiate FrankaControlApi/OpenTacApi, use APIS, or access env directly.

      Task objective: keep the same grasp throughout two ordered tension stages. First control the public estimated_tension_N into the 12 N target band [11.5, 12.5], then without opening or regrasping control it toward the 18 N target inside [17.5, 18.5]. For 18 N, merely crossing the lower band edge is not arrival: reach the public target before starting the hold, allowing only the contract's controller deadband around that target. Do not chase exact floating-point equality. Time is a strict continuous requirement: each stage must remain in its required range for one uninterrupted full 3.0-second window. Do not begin the 18 N stage until the full 12 N hold has completed. Do not end after only the first stage. Do not read or infer simulator true tension, actor state, reward, success, task metadata, private task fields, or direct environment objects.

      The CaP-X adapter has already brought the open gripper to the public non-contact strap approach. First call close_gripper(adaptive=True, target_force=0.0, max_steps=400). This reproduces the expert's public close budget and bilateral-depth stopping protocol; it is not a fixed qpos, width, depth, or physical-force target. Its result has these top-level boolean fields: grasp["stable"], grasp["contact"], grasp["left_contact"], grasp["right_contact"], and grasp["bilateral_contact"]. Continue only when both bool(grasp["stable"]) and bool(grasp["bilateral_contact"]) are true. Otherwise print CAPX_FAILURE and raise RuntimeError; do not start the estimator from a partial grasp and do not invent a regrasp policy. grasp["contact"] is a boolean, never a dictionary: do not call .get(...) on it and do not invent contact_state. Wait contract["estimator_settle_steps"] without moving, then call begin_tactile_tension_estimator() once. Do not open or regrasp between the ordered 12 N and 18 N stages.

      Call get_tactile_tension_control_contract() before control. The contract gives public target bands, sampling cadence, hold duration, motion safety range, and proportional gain. The adapter does not track stage progress, action counts, failure counts, or recovery decisions. Maintain your own local stage index, in-band elapsed time, and any retry/recovery state in the generated code. Control the two public stages in the fixed order: first 12 N, then 18 N. Read the exact band from contract["stage_bands_N"][stage_index]; do not derive another band. Positive move_delta(dz) pulls upward and increases tension; negative dz relaxes the strap. The 18 N stage requires an additional upward motion after the 12 N hold; no API performs this automatically.

      get_tactile_tension_estimate() is only a public numerical observation. When estimate["available"] is true, use estimate["estimated_tension_N"]. When available is false, the estimate is temporarily unavailable: do not treat it as task failure and do not move from an unobserved estimate. Wait and sample again. The adapter never provides a consecutive-failure count, a failure reason, a completed-stage flag, or a prescribed recovery. Do not add an arbitrary local wait, retry, sample, action, or iteration limit; native physical terminal conditions and the trial timeout bound the run.

      For each stage, sample at the public cadence. The exact cadence fields are contract["sampling_cadence_steps"] and contract["sampling_cadence_seconds"]. Read target from contract["stage_targets_N"][stage_index] and the official band from contract["stage_bands_N"][stage_index]; do not derive a new task band. Maintain filtered_tension locally: initialize it from the first available estimated_tension_N, then update it as filtered += contract["force_filter_alpha"] * (raw - filtered). Use filtered_tension for both control and hold checks. The first stage counts available samples inside its official band. For the second stage, samples between the lower band edge and target - contract["controller_deadband_N"] are still an approach, not a hold. Start and continue its hold timer only while filtered_tension is at least target - contract["controller_deadband_N"] and no greater than the official upper band edge. Never drive past the upper edge deliberately. When in the stage's valid hold range, do not move; wait_steps(contract["sampling_cadence_steps"]) and add contract["sampling_cadence_seconds"] for each valid cadence until contract["stage_hold_seconds"] is reached. On an unavailable or out-of-range sample, reset that stage's timer; never join separated intervals. Outside the valid hold range, calculate error = target - filtered_tension; if abs(error) is above contract["controller_deadband_N"], call move_delta(dz=clip(error * contract["proportional_delta_gain_m_per_N"], -contract["max_delta_z_m"], contract["max_delta_z_m"])) once, then read a fresh estimate without an extra wait. Otherwise wait_steps(contract["sampling_cadence_steps"]) before reading again. Do not create a local sample, retry, action, or iteration cap; native physical terminal conditions and the trial timeout bound the run.

      A move_delta already advances one native control cadence; do not add wait_steps immediately after it.

      Immediately after each locally completed 3-second hold, call capture_tactile_stage_response() once and print its capture ID and quality for diagnostics. The 10D response is recorded in the video and artifact only. Do not calculate frozen-memory distances, and do not treat response quality, response memory, or images as a completion gate. The numerical estimate and your uninterrupted in-band timer are the only agent-side stage-progress criteria. The task itself independently applies the expert's physical acceptance and termination rules: two ordered 3-second physical holds, plus its own grasp-loss, overload, travel-limit, and 60-second timeout checks. Do not invent a separate action budget, early-success condition, or terminal heuristic. After the second local hold, stop commanding and end normally; task completion is reported independently by the environment.

      Every submitted or regenerated code block must be independently executable. At the top of any block that needs it, retrieve contract again; never rely on variables created by an earlier code block. The adapter has no persisted stage checkpoint, so a recovery block must not claim a previous stage completed unless its own code has established that fact. On a deliberate failure, print CAPX_FAILURE and raise RuntimeError without catching or swallowing it. Do not wrap the main program in `except SystemExit: pass` or a broad exception handler that turns a failure into apparent success.

      Advance after the local numerical hold completes, then capture the diagnostic response. At 18 N, reaching 17.5 N in the estimate alone must not stop the lift or start the timer; approach the public 18 N target, hold there without moving for the full valid numerical window, capture the diagnostic response, then end normally. Return concise executable Python only.
    multi_turn_prompt: |
      Executed code:
      {executed_code}

      Console stdout:
      {console_stdout}

      Console stderr:
      {console_stderr}

      This is failure-only recovery. The appended OpenTac context is only the latest public numerical estimate; it has no stage checkpoint or recovery verdict. Do not infer completed holds from it. The documented functions are already injected as top-level names: do not import or instantiate API classes. The regenerated block must be independently executable: retrieve contract again instead of assuming prior local variables exist. Use only contract["sampling_cadence_steps"] and contract["sampling_cadence_seconds"] for cadence. If closing is needed, use close_gripper(adaptive=True, target_force=0.0, max_steps=400); it returns top-level boolean bilateral_contact, left_contact, right_contact, stable, and contact; contact is not a mapping and there is no contact_state. Preserve the environment-owned physical termination rules: do not add action-count terminal conditions or claim task success yourself. Do not use private force signals or change the 12 N then 18 N target sequence.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/vitaforge_tension_strap_stage_memory_control
trial_timeout_seconds: 1800
max_trial_retries: 1
max_regenerations: 1
stop_multiturn_when_regeneration_exhausted: true
save_multiturn_prompts: true
split_code_blocks_on_breakpoint: true
multi_turn_on_failure_only: true
filter_multiturn_console: true
multiturn_console_max_lines: 10
multiturn_console_max_chars: 1000
multiturn_console_keep_recent_other: 0
multiturn_executed_code_max_chars: 3000
multiturn_remaining_code_max_chars: 1000
include_trial_memory_in_multiturn: true
multiturn_trial_memory_max_chars: 1000
tactile_memory:
  trial:
    enabled: false
    include_in_multiturn: false
  persistent:
    enabled: false
