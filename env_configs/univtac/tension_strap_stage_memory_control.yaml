# One-process, one-seed CaP-X control run for ViTaForge's tension_strap task.
env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    stream_user_code_output: false
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: ${oc.env:UNIVTAC_ROOT,/mnt/sdc/ljz/OpenTacBench_capx}
      task_name: tension_strap
      task_config: tension_strap
      force_task: true
      force_task_seed: ${oc.env:CAPX_FORCE_TASK_SEED,1}
      seed_base: ${oc.env:CAPX_FORCE_TASK_SEED,1}
      device: cuda:0
      live_preview_enabled: true
      live_preview_path: ${oc.env:CAPX_LIVE_PREVIEW_PATH,/tmp/capx_tension_strap_preview.jpg}
      live_preview_stride: 5
      live_preview_jpeg_quality: 85
      # 120 Hz physics / 8 = 15 fps.  The video therefore preserves simulation
      # time while avoiding a full 1600x1200 dashboard encode on every render.
      video_stream_fps: 15.0
      video_renderer: task_native
      tension_response_panel:
        enabled: true
        history_points: 360
      # Adapter pre-move is benchmark initialization, not agent behavior. Keep
      # the 60 Hz render cadence needed for tactile observations, but let
      # CaP-X own the sole encoded video stream at 15 fps.
      task_config_overrides:
        # Physical damage/limits remain native; acceptance waits for agent END.
        official_task_protocol: true
        force_sequence_manifest: ${oc.env:CAPX_FORCE_SEQUENCE_MANIFEST,""}
        task_parameters:
          strap_color_mode: ${oc.env:CAPX_STRAP_COLOR_MODE,tricolor}
        task_cfg_overrides:
          save_pre_move: false
        record_video_during_reset: false
        record_pre_move_frames: false
        record_pre_move_tactile_timeline: false
        # eval_test avoids BaseTask's unconditional eval render and its native
        # VideoHandler. render_frequency=2 is the public 60 Hz sensor cadence.
        runtime_task_mode: eval_test
        render_frequency: 2
        video_frequency: 0
        video_frame_stride: 8
        force_task_adapter_pre_move: true
      runtime_preflight:
        enabled: true
        tacex_root: ${oc.env:TACEX_RUNTIME_ROOT,/mnt/sdc/ljz/OpenTacBench_capx/third_party/TacEx}
        require_contact_gradient: true
        require_attached_gelpad_asset: true
        require_attachment_points: true
      api_configs:
        franka_control_api:
          llm_api_profile: opentac_tension_control
          llm_visible_functions: [move_delta, open_gripper, close_gripper, get_robot_state, wait_steps]
          tactile_adaptive_gripper_enabled: true
          use_native_pose_planner: false
          # Match the expert's capped 2 mm/s pull at its 60 Hz public cadence.
          # GPU load changes wall-clock time, not physical control velocity.
          local_delta_max_m: 0.00003333333333333333
          local_delta_segment_m: 0.00003333333333333333
          force_task_target_lead_m: 0.00003333333333333333
          min_safe_z: 0.10
          # The official public grasp has a 400-command budget, with two
          # physics ticks per command.  This is a budget, never a qpos goal.
          max_gripper_servo_steps: 400
          adaptive_gripper:
            # Match the expert's raw bilateral depth stop and remaining-depth
            # taper. The close budget and two-tick commands remain unchanged.
            coarse_qpos_step: 0.0001
            fine_qpos_step: 0.0001
            raw_depth_target_mm: 27.6
            raw_depth_gain_qpos_per_mm: 0.0005
            raw_depth_min_step_qpos: 0.000005
            settle_steps_per_command: 2
            contact_debounce_frames: 1
            stable_debounce_frames: 1
            contact_force_threshold: 0.0
            contact_balance_threshold: 1.0
            slip_threshold: 1.0
            one_sided_force_limit: 1.1
            target_depth_delta_mm: 0.0
            min_stable_contact_area: 0.0
            post_squeeze_qpos: 0.0
            post_squeeze_steps: 0
            hold_steps: 0
        opentac_api:
          llm_visible_functions: [get_tactile_tension_control_contract, begin_tactile_tension_estimator, get_tactile_tension_estimate, capture_tactile_stage_response]
          tension_estimator_mode: public_depth_marker_regression_v1
          tension_calibration_path: env_configs/univtac/tension_calibration/tension_strap_public_tactile_force_69seed.v1.json
          tactile_stage_memory_path: env_configs/univtac/tactile_response_memory/tension_strap_12n_18n.v2.json
          # Expert-equivalent P controller: clamp(error / 2000 m/s, +/-2 mm/s)
          # and apply it for two 120 Hz physics ticks per public action.
          max_delta_z_m: 0.00003333333333333333
          observation_wait_steps: 2
          observation_dt_s: 0.008333333333333333
          stage_hold_seconds: 3.0
          stage_entry_offsets_N: [0.4, 0.2]
          estimator_settle_steps: 30
          force_filter_time_constant_s: 0.15
          # The public estimator is conservatively biased low near 18 N.
          # A 0.20 N deadband starts the second-stage hold at 17.8 N, which
          # remains inside the official [17.5, 18.5] N acceptance band and
          # avoids impractically slow sub-micron corrective pulls.
          controller_deadband_N: 0.20
          proportional_delta_gain_m_per_N: 0.000008333333333333333
          stage_targets_N: [12.0, 18.0]
          stage_tolerance_N: 0.5
          estimator_update_stride: 1
          max_estimate_age_steps: 3
          # Evaluator-only: pairs public estimates with private physics in a
          # post-run artifact. It never enters an API response, prompt, video,
          # or control decision.
          private_force_audit:
            enabled: true
            sample_stride: 1
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis: [FrankaControlApi, OpenTacApi]
    prompt: |
      Complete this public tension-strap task using only the documented functions from FrankaControlApi and OpenTacApi. The documented API names are already injected as top-level Python functions. Call them directly, for example close_gripper(...), get_tactile_tension_estimate(), and move_delta(dz=...). Do not import API modules, instantiate FrankaControlApi/OpenTacApi, use APIS, or access env directly. The only allowed file I/O is reading/writing AGENT_PROGRESS_PATH and its temporary sibling with Python json/os; never read other files.

      AGENT_PROGRESS_PATH is an absolute, trial-specific JSON file supplied by the runner. At the start of EVERY code block, load it before any action. The file EXISTS at the start of the first block with status="uninitialized"; treat this exact state as a fresh trial and construct a full status="active" record with grasp_confirmed=False, estimator_started=False, completed_stages=[], active_stage_index=0, hold_elapsed_s=0.0, filtered_tension_N=None, last_sample_step=None. Do not mistake it for a missing file or reject it as an invalid active record. Only the first block may initialize it; a recovery block with a missing, invalid, or still-uninitialized file must print CAPX_FAILURE reason=agent_progress_unavailable and stop rather than guess or replay. After successful grasp, after estimator startup, after each fresh estimate, and immediately upon completing either hold, atomically write a full record to AGENT_PROGRESS_PATH: dump JSON to AGENT_PROGRESS_PATH + ".tmp", then os.replace it. Use schema_version="capx_agent_progress.v1", status="active", grasp_confirmed, estimator_started, completed_stages ([], [0], or [0,1]), active_stage_index (0, 1, or 2), hold_elapsed_s, filtered_tension_N, last_sample_step. All values come only from your own control and public estimate; do not store true tension or private task state. Never treat writing the file as proof that the native physical scorer accepted a stage.
      Initial-block parse order: read the existing JSON, then test if saved.get("status") == "uninitialized" before validating active-record fields. Do not initialize only on FileNotFoundError. On a regenerated block, uninitialized is an error; accept only a valid active record.

      Task objective: keep the same grasp throughout the two ordered public stages in the control contract. For stage_index 0 and then 1, approach contract["stage_entry_thresholds_N"][stage_index] inside contract["stage_bands_N"][stage_index], stop moving, and hold continuously for contract["stage_hold_seconds_per_stage"][stage_index]. The entry threshold starts a hold; it is not a narrower acceptance band. Once holding, count every fresh available sample inside the entire official band and reset only on unavailable or out-of-band data. Do not chase floating-point equality, repeat a completed stage, or end after only the first stage. The sequence and durations are public task instructions selected by the frozen seed manifest when configured. Do not read or infer simulator true tension, actor state, reward, success, task metadata, private task fields, or direct environment objects.
      This YAML sets the official tolerance to +/-0.5 N around each stage target. Read the exact inclusive [lower, upper] bounds from contract["stage_bands_N"][stage_index]; an estimate is in band exactly when lower <= filtered_tension <= upper. The entry threshold is only a prerequisite for STARTING a hold, never a replacement for the lower or upper bound while holding. Once started, every fresh in-band sample counts even if the estimate crosses back past the entry threshold; reset the timer only when an estimate is unavailable or outside [lower, upper].
      At each stage, set target = contract["stage_targets_N"][stage_index], hold_duration = contract["stage_hold_seconds_per_stage"][stage_index], band = contract["stage_bands_N"][stage_index], and entry = contract["stage_entry_thresholds_N"][stage_index]. Never reuse a prior stage's target or duration.

      The CaP-X adapter has already brought the open gripper to the public non-contact strap approach. Only when the progress file is uninitialized in the initial block, call close_gripper(adaptive=True, target_force=0.0, max_steps=400). The adapter follows the expert's public bilateral raw-depth stop and slows closing as it approaches that threshold; no seed-specific qpos or physical-force target is supplied. Its result has these top-level boolean fields: grasp["stable"], grasp["contact"], grasp["left_contact"], grasp["right_contact"], and grasp["bilateral_contact"]. Continue only when both bool(grasp["stable"]) and bool(grasp["bilateral_contact"]) are true, then immediately save grasp_confirmed=true. Otherwise print CAPX_FAILURE and raise RuntimeError; do not start the estimator from a partial grasp and do not invent a regrasp policy. grasp["contact"] is a boolean, never a dictionary: do not call .get(...) on it and do not invent contact_state. Wait contract["estimator_settle_steps"] without moving, then call begin_tactile_tension_estimator() once and save estimator_started=true. On recovery with those flags already true, do not close, wait for settling, or restart the estimator. Do not open or regrasp between the ordered stages.

      Call get_tactile_tension_control_contract() before control. Read contract["stage_hold_seconds_per_stage"], contract["stage_targets_N"], contract["stage_bands_N"], and contract["stage_entry_thresholds_N"] before any physical action; do not invent alternative duration keys. The adapter does not track stage progress, action counts, failure counts, or recovery decisions; your JSON file is the only stage checkpoint. Resume from active_stage_index and completed_stages. If stage 0 is recorded complete, go directly to stage 1 without replaying stage 0. For an interrupted partial hold, keep saved hold_elapsed_s only when a fresh public estimate is available, inside the official stage band, and its sample_step equals last_sample_step: then no unverified simulator step occurred. A positive saved hold_elapsed_s proves its entry threshold was already reached; do not require reaching that threshold again to preserve the timer. Otherwise reset only the active hold_elapsed_s to zero, save it, and retain already completed stages. Restore filtered_tension_N only across that verified no-gap case; otherwise initialize the filter from the fresh estimate. Positive move_delta(dz) pulls upward and increases tension; negative dz relaxes it. Move in the direction of each stage's public target; a descending second stage may require relaxation rather than further upward motion.

      get_tactile_tension_estimate() is only a public numerical observation. When estimate["available"] is true, use estimate["estimated_tension_N"]. When available is false, the estimate is temporarily unavailable: do not treat it as task failure and do not move from an unobserved estimate. Wait and sample again. The adapter never provides a consecutive-failure count, a failure reason, a completed-stage flag, or a prescribed recovery. Do not add an arbitrary local wait, retry, sample, action, or iteration limit; native physical terminal conditions and the trial timeout bound the run.

      For each stage, sample at the public cadence using contract["sampling_cadence_steps"] and contract["sampling_cadence_seconds"]. Maintain filtered_tension locally: initialize it from the first available estimated_tension_N, then update it as filtered += contract["force_filter_alpha"] * (raw - filtered). Use filtered_tension for control and hold checks. Before a new hold, approach the stage's entry threshold from the direction of the previous stage: for an upward transition, stay in motion while below the threshold; for a downward transition, stay in motion while above it. Start the timer only when a pre-wait filtered sample is inside the official band and has reached the entry threshold from the correct direction. The pre-wait sample establishes entry; each post-wait sample needs only to remain inside the official band. Once hold_elapsed_s is positive, count every fresh sample inside the full band even when it crosses the entry threshold. Never deliberately drive past the band edge. While holding, do not move; wait_steps(contract["sampling_cadence_steps"]), read a fresh estimate, and add contract["sampling_cadence_seconds"] only if that post-wait sample is available and inside the band; save the updated time and sample_step atomically. On unavailable or out-of-band data, reset that stage's timer and save; never join separated intervals. Before any move_delta, save hold_elapsed_s=0 so interrupted motion cannot preserve an invalid hold. Outside a hold, calculate error = target - filtered_tension; if abs(error) exceeds contract["controller_deadband_N"], call move_delta(dz=clip(error * contract["proportional_delta_gain_m_per_N"], -contract["max_delta_z_m"], contract["max_delta_z_m"])) once, then read a fresh estimate without an extra wait. Otherwise wait_steps(contract["sampling_cadence_steps"]) before reading again. Do not create a local sample, retry, action, or iteration cap; native physical terminal conditions and the trial timeout bound the run.

      A move_delta already advances one native control cadence; do not add wait_steps immediately after it.

      Check the returned dictionary from EVERY wait_steps(...) and move_delta(...), including the initial estimator-settling wait. Use one small require_action(result) helper and wrap every such call. On any ok=False result, print CAPX_FAILURE with the reason and raise RuntimeError. Never continue a hold or motion loop after an action returns ok=False. This checks the public action status only; do not read task success or private state. At the start of each code block capx_stop is False; only set it to the literal boolean True at top level after both local holds have completed.

      Immediately after each locally completed hold, atomically add its index to completed_stages, advance active_stage_index, and save BEFORE calling capture_tactile_stage_response() once. Do not print capture fields; the API saves the 10D response in the artifact, and diagnostic printing must not interrupt control. The 10D response is recorded in the video and artifact only. Do not calculate frozen-memory distances, and do not treat response quality, response memory, or images as a completion gate. The numerical estimate and your uninterrupted in-band timer are the only agent-side stage-progress criteria. Native grasp-loss, overload, travel-limit, and timeout protections remain active, but native physical acceptance does not stop policy control. After the second local hold, set capx_stop = True at top level and end normally. The evaluator then calls finish_episode() exactly once and records the private physical verdict only in final artifacts. Never call finish_episode() yourself or read that verdict.

      Every submitted or regenerated code block must be independently executable. At the top of any block that needs it, retrieve contract again and load the progress JSON; never rely on variables created by an earlier code block. A recovery block may trust only a valid agent-written completed_stages checkpoint, not the latest tension estimate alone. On a deliberate failure, print CAPX_FAILURE and raise RuntimeError without catching or swallowing it. Do not wrap the main program in `except SystemExit: pass` or a broad exception handler that turns a failure into apparent success.

      Advance after each local numerical hold completes, then capture the diagnostic response. Reaching a band's edge alone does not finish a stage: approach its public entry threshold from the correct direction, hold inside the band without moving for that stage's full duration, and only after stage 1 completes set capx_stop = True at top level. Do not submit END on failure or after stage 0 alone. Return concise executable Python only.
    multi_turn_prompt: |
      Executed code:
      {executed_code}

      Console stdout:
      {console_stdout}

      Console stderr:
      {console_stderr}

      This is failure-only recovery. The appended agent_progress.json snapshot is the agent's own public stage checkpoint, not task GT. The regenerated block must load AGENT_PROGRESS_PATH before acting and independently retrieve the contract, including contract["stage_hold_seconds_per_stage"]; never invent duration keys or rely on prior Python locals. If the checkpoint is missing, invalid, or still uninitialized after physical actions, fail explicitly rather than guessing or repeating a hold. Keep completed_stages. Preserve a partial hold only if a fresh public estimate is inside the inclusive contract["stage_bands_N"][stage_index] and has exactly the saved last_sample_step; a positive saved hold_elapsed_s means the entry threshold was already reached. Otherwise reset only the active timer. For a new hold, use contract["stage_entry_thresholds_N"][stage_index] and the transition direction; once holding, use the full target +/-0.5 N band from contract["stage_bands_N"][stage_index], not the narrower entry threshold. If REGENERATE replaces pending blocks, include only unfinished stages. Check every wait_steps/move_delta result; any ok=False is a real action failure. Do not close again if grasp_confirmed is saved. Do not print capture metadata; capture_tactile_stage_response() stores it. Never claim task success or read private force signals. Once both local holds are saved, set capx_stop = True at top level and return normally; do not call finish_episode() yourself.
      If the preceding block ended with code_block_timeout, inspect the generated line, elapsed time, action count, and simulator steps. Continue from the file checkpoint and current public estimate, never from an assumed local variable or replayed completed stage.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/vitaforge_tension_strap_stage_memory_control
trial_timeout_seconds: 3600
code_block_wall_timeout_seconds: 3000
max_trial_retries: 1
max_regenerations: 1
stop_multiturn_when_regeneration_exhausted: true
save_multiturn_prompts: true
split_code_blocks_on_breakpoint: true
multi_turn_on_failure_only: true
filter_multiturn_console: true
multiturn_console_max_lines: 10
multiturn_console_max_chars: 1000
multiturn_console_keep_recent_other: 0
multiturn_executed_code_max_chars: 3000
multiturn_remaining_code_max_chars: 1000
agent_progress_file:
  enabled: true
  max_context_chars: 1000
tactile_memory:
  trial:
    enabled: false
    include_in_multiturn: false
  persistent:
    enabled: false
