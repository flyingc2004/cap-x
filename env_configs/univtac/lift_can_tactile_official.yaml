env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: /mnt/sdc/ljz/UniVTAC
      task_name: lift_can
      task_config: smoke_capx_lift_can_official
      seed_base: 0
      device: cuda:0
      api_configs:
        franka_control_api:
          min_safe_z: 0.10
          max_delta_xyz: 0.01
          default_z_approach: 0.08
          home_pose_relative_lift: true
          home_lift_delta_z: 0.10
          preserve_landmark_orientation: false
          use_task_place_actor_for_landmarks: false
          use_task_grasp_actor_for_objects: false
          use_native_pose_planner: false
          record_perception_diagnostic: true
          official_anchor_fallback_enabled: true
          official_anchor_fallback_objects:
            - can
          max_goto_pose_actions: 40
          max_home_pose_actions: 15
          max_native_pose_actions: 2
          max_gripper_servo_steps: 200
          max_gripper_settle_steps: 20
          lift_after_close: false
          gripper_settle_steps: 10
          open_gripper_width: 1.0
          tactile_adaptive_gripper_enabled: true
          rgbd_perception_enabled: true
          perception_camera: head
          perception_prompt_map:
            can: cylindrical can
          perception_prompt_fallbacks:
            can:
              - can
              - cylindrical object
              - small cylinder
          perception_retry_attempts: 2
          sam3_service_url: http://127.0.0.1:8114
          graspnet_service_url: http://127.0.0.1:8115
          perception_timeout_seconds: 120
          perception_min_depth_points: 32
          grasp_local_z_offset: 0.12
          adaptive_gripper:
            coarse_qpos_step: 0.0005
            fine_qpos_step: 0.00005
            contact_debounce_frames: 2
            stable_debounce_frames: 3
            release_debounce_frames: 2
            settle_steps_per_command: 1
            contact_force_threshold: 0.08
            depth_contact_margin_mm: 0.5
          object_pose_names:
            can: can
            object: can
            target object: can
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis:
      - FrankaControlApi
      - UniVTACTactileApi
    prompt: |
      You are controlling a Franka robot in the official UniVTAC lift_can evaluation protocol.
      Goal: use the official pre-grasp state, native tactile feedback, and compact recovery actions to grasp the cylindrical can, lift it, and release it so it can settle upright according to the official task rules.
      The official reset has already opened the gripper and moved it to a randomly perturbed pre-grasp pose near the can. The first grasp attempt must use this current pre-grasp pose directly. Do not call sample_grasp_pose(), get_object_pose(), or goto_pose() before the first close_gripper().
      Use short bounded loops when useful. A recovery loop should usually retry from the current pre-grasp neighborhood: open or loosen the gripper, query tactile feedback, and close again. Do not begin every retry by sampling a new RGB-D grasp. Prefer at most 2-3 grasp attempts, and never use unbounded while loops, long waits, or repeated identical actions without new tactile or perception feedback.
      Tactile hints: stable_grasp or stable=True means lifting is reasonable; one-sided contact usually means the grasp is off-center, so release or loosen and try another compact close from the current pre-grasp neighborhood; slip_detected or contact_lost means the grasp is unsafe for lifting; weak or missing contact means the attempt may be a normal task failure.
      Use RGB-D regrasp only as a last fallback after tactile recovery around the official pre-grasp fails. If you use sample_grasp_pose("can"), check the goto_pose(...) return value. If perception or motion fails, end the program normally without raising, asserting, exiting, or substituting guessed coordinates.
      Use only the six high-level FrankaControlApi motion functions and UniVTAC native tactile functions. Do not call low-level move_delta_ee, move_ee, or move_qpos functions. Keep physical actions compact and check API return values such as stable, released, ok, reason, contact, and slip when available.
      Never inspect task actors, metadata, private labels, reward, success, task_completed, or trial id. Do not load or call ACT or ViTAL policies.
      If a physical action is stopped by the official action budget or early-stop rule, let the program reach its end normally. Do not call exit, quit, assert, or raise an exception for an expected task failure.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/univtac_lift_can_tactile_official
trial_timeout_seconds: 300
max_trial_retries: 1
