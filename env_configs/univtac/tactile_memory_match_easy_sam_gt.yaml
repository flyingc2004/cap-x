# Selection-only Easy-GT engineering smoke.  It validates that CaP-X can
# execute the public probe, write trial memory and select a match.  Transport
# is deliberately out of scope for this first response-memory integration.
env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    stream_user_code_output: false
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: ${oc.env:UNIVTAC_ROOT,/mnt/sdc/ljz/UniVTAC}
      task_name: tactile_memory_match
      task_config: tactile_memory_match_composable_capx_demo
      # Trial 1 maps to the expert-verified fixed demo seed 4002. The class
      # pair and left/right match assignment are never supplied to generated code.
      seed_base: 4001
      device: cuda:0
      live_preview_enabled: true
      live_preview_path: ${oc.env:CAPX_LIVE_PREVIEW_PATH,/tmp/capx_tactile_response_preview.jpg}
      live_preview_stride: 5
      live_preview_jpeg_quality: 85
      memory_overlay_enabled: true
      selection_only_audit: true
      task_config_overrides:
        record_video_during_reset: true
        record_action_frames: true
        video_frame_stride: 4
      api_configs:
        franka_control_api:
          llm_api_profile: tactile_memory_match
          llm_visible_functions: [get_object_pose, sample_grasp_pose, goto_pose, move_delta, open_gripper, close_gripper, wait_steps]
          local_delta_max_m: 0.02
          local_delta_segment_m: 0.002
          local_wait_max_steps: 20
          profile_open_width: 1.0
          profile_open_max_steps: 120
          min_safe_z: 0.035
          native_min_ee_z: 0.035
          gripper_settle_steps: 10
          use_native_pose_planner: true
          use_task_grasp_actor_for_objects: true
          public_anchor_pose_enabled: true
          public_grasp_anchor_objects: [reference_object, candidate_left, candidate_right]
          public_pose_fallback_objects: [reference_object, candidate_left, candidate_right, match_slot]
          official_anchor_fallback_enabled: false
          rgbd_perception_enabled: false
          rgbd_pose_enabled: false
          rgbd_grasp_enabled: false
          max_goto_pose_actions: 90
          max_native_pose_actions: 2
          max_gripper_servo_steps: 120
          min_open_gripper_servo_steps: 80
          max_gripper_settle_steps: 20
          tactile_adaptive_gripper_enabled: true
          adaptive_gripper:
            coarse_qpos_step: 0.0005
            fine_qpos_step: 0.00005
            contact_debounce_frames: 2
            stable_debounce_frames: 3
            release_debounce_frames: 2
            settle_steps_per_command: 1
            contact_force_threshold: 0.08
            contact_balance_threshold: 0.50
            depth_contact_margin_mm: 0.5
            slip_threshold: 0.60
            target_depth_delta_mm: 5.0
            min_stable_contact_area: 0.006
            post_squeeze_qpos: 0.00015
            post_squeeze_steps: 4
            hold_steps: 8
          object_pose_names:
            reference_object: reference_object
            candidate_left: candidate_left
            candidate_right: candidate_right
            match_slot: match_slot
        univtac_tactile_api:
          llm_visible_functions: [get_public_probe_spec, begin_public_probe_capture, begin_public_probe_segment, end_public_probe_segment, finalize_public_probe_capture, get_tactile_response_expression, is_contacting, is_slipping, is_grasp_stable, write_trial_memory, read_trial_memory, list_trial_memory]
          # Generate this file with UniVTAC/tools/build_tactile_response_expression.py
          # from public v4 development trajectories before launching CaP-X.
          tactile_response_expression_path: ${oc.env:CAPX_TACTILE_RESPONSE_EXPRESSION,task_config/tactile_response_expression.v1.json}
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis: [FrankaControlApi, UniVTACTactileApi]
    prompt: |
      You control a UniVTAC tactile-memory response selection smoke. Public reset anchors are allowed only for coarse side-grasp motion. The hidden matching identity must be decided only from public tactile_probe.v4 records and the read-only tactile_response_expression.v1. Never read metadata, labels, density, friction, hardness, reward, success, actor state, private task fields, or direct environment objects. This is an engineering selection demo, not a cross-task generalization claim.

      Call get_public_probe_spec() and get_tactile_response_expression() once. Save both unchanged as trial_memory.v1 state records named probe_spec and response_expression. The public probe spec owns all action/timing/quality values. Define exactly one probe(object_name) helper and call it in this order: reference_object, candidate_left, candidate_right. Reuse the unchanged spec for every object.

      Each probe must execute the standard public chain itself: open_gripper; sample_grasp_pose(object_name); goto_pose the sampled pose; begin_public_probe_capture(object_name); close_gripper(mode="probe"); require stable bilateral tactile contact. Record preload by beginning its segment, waiting exactly probe_spec preload_steps, and ending it. Record lift_motion by beginning its segment, moving exactly probe_spec lift_height, and ending it. Record hold by beginning its segment, waiting exactly probe_spec hold_steps, and ending it. Require stable non-slipping bilateral contact through lift and hold. Lower by the exact negative lift height, wait exactly lower_settle_steps, open, verify release, and let the next sampled side-grasp route provide clearance. Finalize with all public execution flags. If any action or quality gate fails, print CAPX_FAILURE reason=insufficient_tactile_evidence and stop without guessing.

      For each valid probe, write trial_memory.v1 evidence under evidence_reference, evidence_candidate_left, or evidence_candidate_right. Store the complete tactile_probe.v4, response block vectors extracted only from response_expression fields, block quality, capture provenance, and validity. Apply each declared field transform before comparing; expression scalers are fixed Median/IQR values and must not be refit from this trial.

      Read all three evidence records and calculate the fixed response comparison in code. For each response block, use RMS((reference-candidate)/iqr). Derive each object block confidence from the declared bilateral-contact sections and declared public SNR paths; candidate confidence is the minimum of reference and candidate block confidence. Fuse only positive-confidence blocks with the expression's quality-weighted block-RMS rule. Write a trial_memory.v1 decision record named selection containing per-block left/right distances and confidence, fused score_left, score_right, score_margin, selected_candidate, rule version, and rationale. Select the lower fused score, print CAPX_SELECTION, and finish immediately.

      Do not transport a candidate, do not call get_object_pose("match_slot"), and do not print CAPX_SUCCESS. This run measures public probe execution and trial-local memory selection only. Return concise executable Python only.
    multi_turn_prompt: |
      Executed code:
      {executed_code}

      Console stdout:
      {console_stdout}

      Console stderr:
      {console_stderr}

      This is failure-only recovery. Preserve simulator state and the injected agent-authored trial memory. Do not replay a valid probe, change the response expression, use private data, or add transport. Continue only with the first incomplete public probe, or print CAPX_FAILURE and finish.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/univtac_tactile_response_selection
trial_timeout_seconds: 1200
max_trial_retries: 1
max_regenerations: 1
save_multiturn_prompts: true
split_code_blocks_on_breakpoint: true
multi_turn_on_failure_only: true
regenerate_full_chain_on_static_failure: true
filter_multiturn_console: true
multiturn_console_max_lines: 35
multiturn_console_max_chars: 5000
multiturn_console_keep_recent_other: 5
multiturn_executed_code_max_chars: 6000
multiturn_remaining_code_max_chars: 3000
tactile_memory:
  trial:
    enabled: true
    include_in_multiturn: true
    max_context_chars: 4000
  persistent:
    enabled: false
