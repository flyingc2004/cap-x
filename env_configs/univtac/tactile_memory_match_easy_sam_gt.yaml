env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    stream_user_code_output: false
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: /mnt/sdc/ljz/UniVTAC
      task_name: tactile_memory_match
      task_config: tactile_memory_match_demo
      # trial.py seeds trial 1 with 1, so this produces the fixed demo seed 4002.
      seed_base: 4001
      device: cuda:0
      live_preview_enabled: true
      live_preview_path: /mnt/sdc/ljz/t-cap-tactile-memory/capx-runs/latest_preview.jpg
      live_preview_stride: 5
      live_preview_jpeg_quality: 80
      task_config_overrides:
        task_cfg_overrides:
          capx_easy_gt_enabled: true
        record_video_during_reset: true
        record_action_frames: true
        video_frame_stride: 4
      api_configs:
        franka_control_api:
          min_safe_z: 0.035
          native_min_ee_z: 0.035
          max_delta_xyz: 0.012
          max_delta_rpy: 0.25
          max_delta_gripper: 0.02
          default_z_approach: 0.04
          gripper_settle_steps: 10
          use_native_pose_planner: true
          use_task_grasp_actor_for_objects: true
          use_task_place_actor_for_landmarks: true
          task_place_landmark_names: [match_slot]
          task_native_safe_placement: true
          grasp_xy_tolerance: 0.08
          grasp_z_tolerance: 0.04
          grasp_pre_dis: 0.04
          grasp_dis: 0.0
          grasp_height: 0.04
          placement_xy_tolerance: 0.08
          placement_time_dilation_factor: 0.5
          public_anchor_pose_enabled: true
          public_grasp_anchor_objects: [reference_object, candidate_left, candidate_right]
          public_pose_fallback_objects: [reference_object, candidate_left, candidate_right, match_slot]
          official_anchor_fallback_enabled: false
          rgbd_perception_enabled: false
          rgbd_pose_enabled: false
          rgbd_grasp_enabled: false
          max_goto_pose_actions: 90
          max_home_pose_actions: 20
          max_native_pose_actions: 2
          max_gripper_servo_steps: 120
          min_open_gripper_servo_steps: 80
          max_gripper_settle_steps: 20
          goto_pose_tactile_guard_force_threshold: 0.45
          goto_pose_tactile_guard_slip_threshold: 0.45
          tactile_adaptive_gripper_enabled: true
          adaptive_gripper:
            coarse_qpos_step: 0.0005
            fine_qpos_step: 0.00005
            contact_debounce_frames: 2
            stable_debounce_frames: 3
            release_debounce_frames: 2
            settle_steps_per_command: 1
            contact_force_threshold: 0.08
            contact_balance_threshold: 0.50
            depth_contact_margin_mm: 0.5
            slip_threshold: 0.60
            target_depth_delta_mm: 5.0
            min_stable_contact_area: 0.006
            post_squeeze_qpos: 0.00015
            post_squeeze_steps: 4
            hold_steps: 8
          object_pose_names:
            reference: reference_object
            reference_object: reference_object
            candidate_left: candidate_left
            candidate_right: candidate_right
            match_slot: match_slot
            target_slot: match_slot
            slot: match_slot
        tactile_measurement_protocol:
          capture_window: 20
          settle_steps: 10
          close_target_force: 0.82
          close_max_steps: 120
          probe_lift_m: 0.018
          probe_hold_steps: 10
          max_attempts_per_object: 1
          adaptive_close: true
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis: [FrankaControlApi, UniVTACTactileApi]
    prompt: |
      You control the fixed-seed UniVTAC tactile_memory_match Easy-GT smoke. Use reset anchors only to localize reference_object, candidate_left, candidate_right, and match_slot. The hidden matching identity must be decided only from tactile measurements; never read metadata, labels, density, friction, hardness, reward, success, or private task state. Vision may only check grasp following, rotation, drop, and release.

      Call get_tactile_measurement_protocol() once and write the unchanged dictionary as trial_memory.v1 state record probe_spec. Use exactly its canonical keys: capture_window, settle_steps, close_target_force, close_max_steps, probe_lift_m, probe_hold_steps, adaptive_close. Do not invent fallback values or alternate key names. Define one reusable probe(object_name) helper and call it exactly in this order: reference_object, candidate_left, candidate_right. For each object: open the gripper; call sample_grasp_pose(object_name), then goto_pose on that gripper-compatible pose. This routes internally to the task's expert side-grasp approach using the object's current physical pose. Call close_gripper with the unchanged protocol adaptive-close mode, close_target_force, and close_max_steps; wait for protocol settle_steps; require bilateral stable tactile contact; capture the static reading with capture_tactile_observation(capture_window); save robot state; make only the protocol probe_lift_m vertical lift, hold for probe_hold_steps, capture the dynamic reading while held, then return to the saved pre-lift pose. Open, verify release, and let the next sampled grasp pose perform the safe clearance and approach. Any empty or shallow close, loss of bilateral contact, or dropped object invalidates that object evidence: print CAPX_FAILURE reason=insufficient_tactile_evidence and stop without guessing.

      For every valid probe, write a trial_memory.v1 evidence record. Its static 6D vector is left/right depth_mm, marker_displacement_px, and marker_coherence. Its dynamic 6D vector is the same fields at lift minus static. Include capture IDs, the unchanged probe_spec, validity, and provenance. After all probes, read the three evidence records. For every feature use scale=max(abs(left-reference), abs(right-reference), epsilon), compute each candidate's normalized RMS static distance and normalized RMS dynamic distance, then fuse them with equal weight. Pick the lower fused score only. Write one trial_memory.v1 decision record named selection containing selected_candidate, score_left, score_right, score_margin, chosen_features, weights_or_rule, rationale, confidence, and provenance.

      Final transport is a separate regrasp: sample_grasp_pose only for the selected candidate, goto_pose it, close adaptively, and require a new stable bilateral tactile grasp. Then call get_object_pose("match_slot", source="anchor") followed immediately by goto_pose(slot_position, slot_quaternion, monitor_tactile=True). Do not synthesize a hover coordinate, use home_pose(), or make any generic motion while holding the final candidate. For this public slot the adapter exclusively executes the expert-aligned clearance lift, horizontal transport, and vertical descent. Only after that call returns may the code open_gripper(), wait for release verification, and finish. If final contact weakens, slips, rotates, or drops, print CAPX_FAILURE and stop; do not transport a weak probe grasp. Print CAPX_SUCCESS only after verified final release. Return concise executable Python only; use no hard-coded world coordinates or low-level motion APIs.
    multi_turn_prompt: |
      Executed code:
      {executed_code}

      Console stdout:
      {console_stdout}

      Console stderr:
      {console_stderr}

      This is failure-only recovery. Preserve state and read list_trial_memory() before acting. Keep completed evidence and probe_spec unchanged. If an object has invalid evidence, print CAPX_FAILURE reason=insufficient_tactile_evidence and stop. If final transport lost contact, regenerate only a concise regrasp-or-stop continuation using sample_grasp_pose followed by goto_pose; never use home_pose() or synthesize a global waypoint. Do not replay completed probes, recompute from private data, or use a hidden label. After verified final release, print CAPX_SUCCESS and finish without extra motion.
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/univtac_tactile_memory_match_easy_gt
trial_timeout_seconds: 1500
max_trial_retries: 1
max_regenerations: 2
save_multiturn_prompts: true
split_code_blocks_on_breakpoint: true
multi_turn_on_failure_only: true
regenerate_full_chain_on_static_failure: true
filter_multiturn_console: true
multiturn_console_max_lines: 35
multiturn_console_max_chars: 5000
multiturn_console_keep_recent_other: 5
multiturn_executed_code_max_chars: 6000
multiturn_remaining_code_max_chars: 3000
tactile_memory:
  trial:
    enabled: true
    include_in_multiturn: true
    max_context_chars: 4000
  persistent:
    enabled: false
