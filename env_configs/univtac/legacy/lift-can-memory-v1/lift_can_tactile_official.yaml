env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.univtac.UniVTACLowLevelEnv
      univtac_root: /mnt/sdc/ljz/UniVTAC
      task_name: lift_can
      task_config: smoke_capx_lift_can_official
      seed_base: 0
      device: cuda:0
      api_configs:
        franka_control_api:
          min_safe_z: 0.10
          max_delta_xyz: 0.01
          default_z_approach: 0.08
          home_pose_relative_lift: true
          home_lift_delta_z: 0.10
          preserve_landmark_orientation: false
          use_task_place_actor_for_landmarks: false
          use_task_grasp_actor_for_objects: false
          use_native_pose_planner: false
          record_perception_diagnostic: true
          official_anchor_fallback_enabled: true
          official_anchor_fallback_objects:
            - can
          max_goto_pose_actions: 40
          max_home_pose_actions: 15
          max_native_pose_actions: 2
          max_gripper_servo_steps: 200
          max_gripper_settle_steps: 20
          lift_after_close: false
          gripper_settle_steps: 10
          open_gripper_width: 1.0
          tactile_adaptive_gripper_enabled: true
          rgbd_perception_enabled: true
          perception_camera: head
          perception_prompt_map:
            can: cylindrical can
          perception_prompt_fallbacks:
            can:
              - can
              - cylindrical object
              - small cylinder
          perception_retry_attempts: 2
          sam3_service_url: http://127.0.0.1:8114
          graspnet_service_url: http://127.0.0.1:8115
          perception_timeout_seconds: 120
          perception_min_depth_points: 32
          grasp_local_z_offset: 0.12
          adaptive_gripper:
            coarse_qpos_step: 0.0005
            fine_qpos_step: 0.00005
            contact_debounce_frames: 2
            stable_debounce_frames: 3
            release_debounce_frames: 2
            settle_steps_per_command: 1
            contact_force_threshold: 0.08
            depth_contact_margin_mm: 0.5
          object_pose_names:
            can: can
            object: can
            target object: can
      expose_actor_pose: false
      privileged: false
      enable_render: true
    privileged: false
    apis:
      - FrankaControlApi
      - UniVTACTactileApi
    prompt: |
      You are controlling a Franka robot in the official UniVTAC lift_can evaluation protocol.
      The official reset has already opened the gripper and moved it to a randomly perturbed pre-grasp pose around the cylindrical can. Do not open or reposition before the first grasp attempt.
      First call close_gripper(adaptive=True, target_force=1.0, max_steps=160). Inspect its stable/contact fields and UniVTAC native tactile feedback.
      When the first grasp is stable, call home_pose() to lift the grasped can straight upward by 0.10 meters in bounded 0.01 meter steps while preserving the current grasp orientation. Do not invent stricter tactile thresholds after stable=True. Do not command a wrist rotation: the side grasp, vertical lift, contact constraints, and gravity allow the can to turn upright passively. Check native tactile contact and slip after the lift, then call open_gripper(adaptive=True) so the can can settle upright on the table.
      If the first grasp is not stable, open the gripper and perform one explicit non-privileged retry: call sample_grasp_pose("can"), move with goto_pose(grasp_pos, grasp_quat, z_approach=0.08), and close adaptively again.
      get_object_pose uses only head-camera RGB-D, SAM3, and Contact-GraspNet. sample_grasp_pose first tries that same RGB-D pipeline; if RGB-D regrasp is unavailable, the API may internally fall back to the official public pre-grasp anchor for the can. Do not substitute guessed coordinates or hidden simulator state, and do not raise, assert, exit, or quit for an expected perception failure.
      Each high-level motion API is bounded: goto_pose and home_pose will reject a single call that would require too many physical actions, and adaptive gripper calls clamp excessive max_steps.
      Use only the six high-level FrankaControlApi motion functions and UniVTAC native tactile functions. Do not call low-level move_delta_ee, move_ee, or move_qpos functions.
      Never inspect task actors, metadata, private labels, reward, success, task_completed, or trial id. Do not load or call ACT or ViTAL policies.
      If a physical action is stopped by the official action budget or early-stop rule, let the program reach its end normally. Do not call exit, quit, assert, or raise an exception for an expected task failure.
api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1
trials: 1
num_workers: 1
record_video: true
output_dir: ./outputs/univtac_lift_can_tactile_official
trial_timeout_seconds: 300
max_trial_retries: 1
