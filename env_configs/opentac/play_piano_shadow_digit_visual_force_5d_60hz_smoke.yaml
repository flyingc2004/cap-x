# Shadow 60 Hz smoke with causal 5D DIGIT area-rate force inference.
# Native piano dynamics, pitch, hold, release, physics and scoring stay enabled.
shadow_piano_public_skill_library: shadow_piano_public_skills_60hz.v1.yaml
env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    stream_user_code_output: false
    low_level:
      _target_: capx.envs.simulators.opentac_shadow.ShadowPianoLowLevelEnv
      univtac_root: ${oc.env:UNIVTAC_ROOT,/mnt/a/ljz/cap/OpenTacBench}
      piano_notes: [E4, F4, 'C#4', 'D#4', 'D#4', E4, 'C#4', F4]
      piano_dynamics: [light, heavy, light, heavy, light, heavy, heavy, light]
      piano_hold_seconds: 0.12
      piano_require_dynamics: true
      piano_continue_on_note_failure: true
      # CaP-X trial IDs start at 1; reset uses seed_base + trial ID.
      seed_base: 3149
      device: cuda:0
      tactile_image_width: 320
      action_repeat: 4
      digit_piano_config: ${oc.env:CAPX_DIR,/mnt/a/ljz/cap/t-cap/cap-x}/env_configs/opentac/config_digit_piano_0_2.v1.yml
      digit_force_sidecar: ${oc.env:CAPX_DIR,/mnt/a/ljz/cap/t-cap/cap-x}/env_configs/opentac/shadow_digit_key_top_force_5d_area_rate.v1.json
      private_audit_root: ${oc.env:CAPX_SHADOW_PRIVATE_AUDIT_ROOT,/mnt/data/ljz/opentacbench/capx-private-audits/shadow_piano_visual_force_v1}
      visual_key_mode: true
      auto_clear_keyboard_for_visual: true
      snap_visual_key_pixels: true
      mirror_head_view: true
      video_frame_stride: 12
      video_width: 512
    privileged: false
    apis: [ShadowPianoVisualForceApi]
    prompt: |
      Play exactly eight requested notes with the Franka-mounted Shadow Hand index finger, in order:
      E4 light, F4 heavy, C#4 light, D#4 heavy, D#4 light, E4 heavy, C#4 heavy, F4 light.
      Hold and release each note for the native task's required 0.12 seconds. Native pitch, dynamics and hold thresholds remain strict. In this partial-score smoke, a failed note consumes one attempt and the task continues with the next requested note; the final private audit reports how many of eight were correct. Never read score, reward, success, native key force or other private task fields; never call an expert policy.

      The CaP-X adapter has already moved the open hand away from the keyboard before this initial HEAD image. This is the one clear image for mapping all requested keys. The environment supplies public STATIC centers for the leftmost white A0 and rightmost white C8 in both world metres and the displayed HEAD image; the same values are available from get_keyboard_endpoints(). The image is horizontally mirrored for display: low notes are left, high notes right. It is 960x662 pixels with a 22-pixel label strip and a 960x640 camera picture. Use displayed image pixel (x,y) as u=x/960 and v=(y-22)/640. Read x_A0 and x_C8 from the returned A0/C8 display_image_center_px fields; do not re-estimate these anchors from the image. Confirm that both projected anchors agree with the visible end white keys. If they visibly disagree, stop without pressing. The 52 white-key centers have 51 equal intervals and native center spacing 0.0235 m. Compute step_px=(x_C8-x_A0)/51. For horizontal white-key indices, A0=0, C4=23, D4=24, E4=25 and F4=26; C#4 and D#4 are near half-indices 23.5 and 24.5. Use the image to confirm the calculated target cells against white-key boundaries and the repeating two/three-black-key pattern, to center each black selection on the actual black cap, and to choose a vertical pixel inside each key surface. The local image snap can correct small within-key pixel errors; it cannot correct a wrong note or octave.

      Initialize piano_state = globals().setdefault('piano_state', {'completed': 0, 'keys': None, 'attempts': []}). Here completed is the number of note attempts finalized with finish_piano_note_attempt(index), including misses; it is NOT the hidden native success count. Keep it across regenerated code blocks. Call get_keyboard_endpoints() and store its result, x_A0, x_C8, step_px and the four selected (x,y,color) pixels in piano_state['keyboard_calibration']; print PIANO_ENDPOINT_CALIBRATION. Call locate_visual_keys exactly once with normalized u,v,color for E4, F4, C#4 and D#4. The adapter uses the current HEAD pixels to snap each selected point within the same visible white key or black cap, then checks color, order and generic camera projection. Snapping cannot repair a wrong key identity or octave. If snapping rejects the selection, stop without pressing. After a successful call get_hand_state()['visual_key_map_ready'] becomes 1; save the returned map in piano_state['keys'] and use it for the entire sequence. Do not manually set this flag. After the key map is accepted, all later LLM requests are text-only: reuse piano_state['keys'] and do not request another image or remap.

      Generate ONE executable Python program that reads the public endpoints, verifies the image, maps the keys, then immediately executes the complete remaining eight-note chain in a finite loop. The sole exception is an early OOD checkpoint below: end this code block so CaP-X can regenerate from text and the saved key map, then re-probe the SAME unfinished note. Put the action chain in a run() function and call run() at the end so return from run() safely ends only the current code block. Keep piano_state['completed'] across code blocks if recovery is needed. Use only get_keyboard_endpoints, locate_visual_keys, get_hand_state, move_shadow_index, wait_steps, get_index_tactile_rgb, estimate_key_force and finish_piano_note_attempt. move_shadow_index(x,y,z,flexion,steps) sends a native four-dimensional target; 1 action step is four 240 Hz ticks (about 0.0167 s). Native target bounds are x [-0.01,0.09] m, y [-0.32,0.26] m, z [-0.006,0.05] m and index flexion [0,0.50] rad. A target of exactly 0.50 rad is valid. Check native_done after every action and never issue another physical action once true; finalization and END remain allowed.

      The returned visual key map gives PUBLIC wrist_x_offset_m and wrist_y_m targets for each selected note. get_hand_state() gives the ACTUAL measured wrist_x_offset_m and wrist_y_m, not just the last command; wrist_and_index_velocity[0] is actual Y speed in m/s. Before lowering or curling the index for EVERY note, move with the index straight to that note's mapped X/Y at hover_lift_z_m. Then repeatedly advance a few bounded action steps, read get_hand_state(), and compare actual X/Y with the mapped target. Require Euclidean X/Y error <= 0.002 m and absolute Y speed <= 0.015 m/s on three successive checks after advancing steps. Allow at most 360 action steps for this arrival; if it does not settle, print PIANO_STOP with target X/Y, actual X/Y and reason, without descending or pressing. Check native_done each time. Print PIANO_ARRIVAL only after these measured conditions hold. A fixed number of wait_steps(), a sent motion target, or visual_key_map_ready=1 is NOT proof of physical arrival. The adapter also rejects lowering or flexion when measured X/Y is more than 0.002 m from the commanded target or Y speed exceeds 0.015 m/s. Keep using the map inferred from the HEAD image; do not substitute private per-note layout coordinates.

      Use the native expert's shared motion pattern as a numerical PRIOR, not its private policy or hidden key coordinates. Only after measured X/Y arrival, smoothly descend from hover with the index extended; the expert's descent takes about 0.50 s (about 30 action steps). Use fresh public DIGIT force-estimate quality and value to judge contact and guide bounded Z adjustments during the press. A nominal Z, fixed elapsed time, or expert trim does not prove contact. Its press command follows theta(t)=0.50*(3u*u-2u*u*u) rad with u=clamp(t/0.45 s,0,1): at 0.15/0.30/0.45 s the targets are about 0.13/0.37/0.50 rad. At 60 action steps/s this is about 27 bounded commands; compute the target from elapsed time rather than a fixed flexion increment. Its successful press stage lasts at least 1.0 s from press start, then it extends the index over about 0.30 s (about 18 actions) and lifts to hover over about 0.50 s (about 30 actions). The requested musical hold is 0.12 s after stable contact. Treat 1.0 s as a minimum press duration, not an automatic release time; permit at most 90 press action steps (1.5 s) while bounded feedback remains safe. Never exceed native action bounds.

      The expert's median wrist-height trim at a scored press, relative to the mapped nominal press_lift_z_m, is about -0.00069 m white/light, -0.00286 m white/heavy, -0.00090 m black/light, -0.00209 m black/heavy across 50 successful episodes. These are four reusable bounded probe references, not per-note positions, contact proof or force labels. The visual map chooses each key and its wrist x/y; use the current HEAD image to select that key, public hand state to confirm arrival, and later public get_hand_state() X/Y, speed and DIGIT estimates to adjust bounded flexion/height if a probe fails. Do not hard-code a world y for any note or call the native demonstration policy. Preserve room for visual corrections instead of blindly replaying an expert trajectory.

      Check a fresh estimate_key_force(note) during the press and hold. The public estimate returns estimated_key_force_N, sample_step, age_steps, quality and calibration_version; use only quality='ok' with age_steps=0 for force control. 'no_contact' is allowed during approach. OOD has no usable Newton value: stop pressing and safely release. Track had_valid_contact separately for each note, setting it only after a quality='ok' force estimate. For an early OOD when i not in piano_state.setdefault('ood_reprobe_indices', []), had_valid_contact is false, no hold streak has begun, and the commanded finger is still curling below 0.495 rad, do NOT call finish_piano_note_attempt, do NOT increment piano_state['completed'], and do NOT submit END. If release reaches native_done, follow terminal handling without another action or re-probe. Otherwise, once the finger is extended at hover, append this zero-based index to piano_state.setdefault('ood_reprobe_indices', []) and set piano_state['pending_reprobe'] to PUBLIC values only: index, note, quality, sample_step, probe Z and last flexion. Print a line beginning exactly `PIANO_STOP OOD_REPROBE` with that record, then return from the top-level run function. This ends the current code block and requests a text-only regeneration using the saved key map; the native attempt remains on the same note until finalized. Only one such checkpoint is allowed per note. On a second OOD for this note, or any OOD after valid contact, safely release, finalize the attempt and continue. Invalid or stale estimates also require safe release and finalization. White light/heavy targets are 0.35/0.50 N with 0.07 N tolerance; black light/heavy targets are 0.70/1.00 N with 0.14 N tolerance. Leave a conservative margin below the upper tolerance and release on an overforce estimate. The calibration is not guaranteed under a new contact pose: if an expert-like bounded probe does not reach the estimated force band, do not keep pushing or guess Newtons. DIGIT appearance responds to simulated key contact force; it is not an independent physical force sensor.

      After measured X/Y arrival and near-full finger flexion, hold Z fixed until successive fresh quality='ok' contact estimates stop rising; two contact samples alone do not establish stability. Only then regulate the press height from the PUBLIC estimate at every action step. Use the native target force for this note as the setpoint, NOT the offline median. Positive Z lifts the wrist and reduces contact force; negative Z lowers it. Define z_probe once from the bounded expert-like probe height and keep a separate commanded z. For each fresh valid stable reading, compute error_N=estimated_key_force_N-target_force_N and update z by clip(0.012*error_N,-0.003,0.003)*(4/240) metres, then clip z to [z_probe-0.0010,z_probe+0.0010] and the native Z bounds. This is at most 0.00005 m per action step and 0.0010 m total from the probe; use the newly adjusted z in the NEXT move_shadow_index command. Print PIANO_FORCE_TRIM with the note, public sample_step, estimated force, target force, previous Z and next Z for every valid feedback update so the private audit can later align them by step; do not print or read true force. Thus a low but valid stable estimate permits a small downward correction and a high estimate raises the wrist. Do not make force corrections from 'no_contact', stale, OOD, nonfinite or early transient readings. If the estimate reaches the native upper tolerance, release and finalize this failed note instead of trying to recover from overforce. If contact cannot be held within this bounded correction range, release and finalize this failed note. Recheck quality, force and native_done after EVERY action; never infer that the intervening four physics ticks were all in band.

      Start the musical hold clock ONLY after near-full flexion and stable public contact have been established at fixed Z, and the first fresh estimate is strictly above the corresponding OFFLINE median of measured key-top forces in scored 0.12 s hold windows of 50 successful expert episodes: white/light 0.311 N, white/heavy 0.473 N, black/light 0.615 N, black/heavy 1.040 N. These aggregates are public calibration guidance, never runtime true force labels. Keep a CURRENT consecutive-sample streak, its first sample_step, and a current hold_confidence. A sample qualifies only if quality='ok', age_steps=0, force is finite, force > median and force < target+tolerance, and sample_step advances by exactly one action step from the previous qualifying sample. Reset the streak, first sample_step and hold_confidence=False on ANY lower, missing, stale, no_contact, OOD, nonfinite or nonconsecutive sample; release immediately on OOD or estimated overforce as specified above. Recompute hold_confidence after EVERY press action as (current streak >= 9 AND (latest sample_step - first sample_step)*4/240 >= 0.12); never latch a past True across later bad readings. The median is a COUNTER GATE, not a control setpoint: keep the native target force as the bounded Z-feedback setpoint. Do not release merely because 60 press actions have elapsed. Release with provisional public hold confidence only when at least 60 press actions have elapsed since press start AND the CURRENT streak still qualifies at the latest sample; otherwise continue one bounded feedback action at a time, up to 90 press actions total, while quality and force remain safe. If no current qualifying streak exists by that cap or bounded correction cannot maintain contact, safely release, finalize the attempt and report public hold as uncertain. Do not wait or push beyond safety bounds to manufacture nine samples. The native scorer checks every 240 Hz physics tick, which these 60 Hz public samples cannot certify; never claim that hold_confidence proves native scoring.

      Finalize EVERY note attempt, including no contact, uncertain hold, later OOD and overforce, EXCEPT a first early OOD checkpoint for the current note just described. Do not finalize or advance the pending note during that checkpoint. First extend the index and lift to hover until all keys are released; then call finish_piano_note_attempt(index) exactly once with zero-based index i. It returns only ok and native_done, never a score or note result. Clear piano_state['pending_reprobe'] when this note is finalized. Append a PUBLIC summary to piano_state['attempts'], set piano_state['completed']=i+1 and print PIANO_NOTE with note, attempted index, public estimate quality, contact/hold confidence and abort reason. Mark the public outcome uncertain when needed; never claim that a public estimate proves native scoring. Continue the next requested note even after an aborted attempt. If native_done becomes true during release of the final eighth note, do not send another physical action: finish that released attempt if pending, record its PUBLIC summary, set piano_state['completed']=8, then continue to the common END path without another physical action. Do not return early merely because the final release ended the native episode. If native_done is true before all eight attempts, stop actions and report PIANO_STOP; this indicates a hard task terminal state. After all eight attempts, set capx_stop=True and submit END; the private native audit will report the number actually correct. Keep the accepted visual key map; do not remap based on an occluded view. Normally do not call breakpoint_code_block(). If a new control decision is needed before a failed attempt, print CAPX_VISUAL_CHECKPOINT finger_alignment and call breakpoint_code_block() at top level; the continuation is text-only and must reuse the accepted map with fresh public hand and DIGIT state.
    multi_turn_prompt: |
      Previous code:
      {executed_code}
      Stdout:
      {console_stdout}
      Stderr:
      {console_stderr}
      Recover from piano_state['completed'], the number of attempts already finalized with finish_piano_note_attempt(index), not the hidden number of correct notes. Never replay a finalized attempt. When VISUAL_KEY_MAP_READY=1, retain piano_state['keys'] and piano_state['keyboard_calibration']. No image is attached after the key map is accepted; use the persistent accepted coordinates and public hand and DIGIT state. Compare each saved target X/Y with the measured X/Y from get_hand_state(); wait for three successive position/speed checks before lowering or flexing. At near-full flexion keep Z fixed until successive fresh public force estimates stop rising; then use bounded Z feedback around the native note target, at most 0.00005 m per action and 0.0010 m from probe. The offline median is only a hold counter gate, never the controller setpoint. Start the hold clock after stable contact, recompute its nine-sample confidence after every action and reset it on any invalid or lower reading; never treat 60 press actions as unconditional completion, and cap the bounded press at 90 actions. If stdout contains PIANO_STOP OOD_REPROBE, the current note was safely released but NOT finalized: answer REGENERATE with executable code, inspect the public hand state and saved key map without an image, and re-probe piano_state["pending_reprobe"]["index"] before any later note. Adjust only bounded public wrist/finger targets; never read native scoring or private force. The one re-probe chance for this note is now used; do not request another OOD checkpoint for that index. If OOD happens again for this note, or if overforce, missing contact or uncertain hold occurs, safely release, finalize THAT attempt and continue to the next note; do not guess force or consult native scoring. If native_done occurs before the final released attempt, stop actions. If it occurs during the final release, finalize that attempt without another action and submit END. Do not recount keyboard endpoints or remap after acceptance. If VISUAL_KEY_MAP_READY=0, verify public A0/C8 against the clear HEAD image and generate the remaining chain. Submit END after eight finalized attempts, regardless of how many seemed correct from public signals.
trials: 1
num_workers: 1
record_video: true
output_dir: ${oc.env:CAPX_OUTPUT_DIR,/mnt/data/ljz/opentacbench/capx-runs/shadow_piano_visual_force_5d_60hz_smoke}
trial_timeout_seconds: 7200
code_block_wall_timeout_seconds: 3300
max_trial_retries: 0
max_regenerations: 8
stop_multiturn_when_regeneration_exhausted: true
multi_turn_on_failure_only: true
multiturn_requires_checkpoint_or_failure: true
shadow_piano_recover_on_stop: true
shadow_piano_wrist_on_failure: false
split_code_blocks_on_breakpoint: true
visual_checkpoint_markers: [finger_alignment]
use_visual_feedback: true
use_wrist_camera: false
visual_feedback_raw_camera_views: true
visual_feedback_context: shadow_piano
visual_feedback_max_image_side_px: 960
visual_feedback_jpeg_quality: 92
visual_feedback_allow_unlisted_model: true
visual_feedback_require_image_input: true
save_multiturn_prompts: true
tactile_memory:
  trial: {enabled: false, include_in_multiturn: false}
  persistent: {enabled: false}
